<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101024">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tetris">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='2' y='2' width='28' height='28' rx='6' fill='%2346c8e0'/%3E%3Crect x='34' y='2' width='28' height='28' rx='6' fill='%23a868e0'/%3E%3Crect x='2' y='34' width='28' height='28' rx='6' fill='%23ffb454'/%3E%3Crect x='34' y='34' width='28' height='28' rx='6' fill='%23e05868'/%3E%3C/svg%3E">
<title>Tetris</title>
<style>
/* ══ Tetris · notte indaco, cromo ambra ══
   Tema unico e voluto: uno schermo di gioco. Tutti i colori sono
   dichiarati esplicitamente, il fondo non eredita mai dall'host. */
:root{
  --notte:#101024;        /* fondo pagina, indaco notte */
  --pozzo:#0b0b19;        /* interno del pozzo */
  --telaio:#26264a;       /* bordi e linee */
  --telaio-soft:#191938;  /* pannelli */
  --avorio:#eae7db;       /* testo primario */
  --nebbia:#8f8fae;       /* testo attenuato */
  --ambra:#ffb454;        /* accento VFD */
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--notte);
  background-image:radial-gradient(120% 70% at 50% -10%,#1a1a3a 0%,var(--notte) 62%);
  color:var(--avorio);
  font-family:var(--sans);
  touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--ambra);outline-offset:3px;border-radius:12px}

#app{
  height:100vh;height:100dvh;
  max-width:560px;margin:0 auto;
  display:flex;flex-direction:column;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(14px,env(safe-area-inset-left,0px))
          calc(env(safe-area-inset-bottom,0px) + 10px) max(14px,env(safe-area-inset-right,0px));
}

/* ── intestazione ── */
header{display:flex;align-items:center;justify-content:space-between;flex:none}
#logo{display:block}
.hdr-btns{display:flex;gap:8px}
.chip{
  width:40px;height:40px;border-radius:12px;
  background:linear-gradient(#20203f,#161630);
  border:1px solid var(--telaio);
  color:var(--nebbia);font-size:17px;line-height:1;
  display:grid;place-items:center;
}
.chip:active{transform:translateY(1px);border-color:#3a3a72;color:var(--avorio)}

/* ── quadro punteggi ── */
#hud{display:flex;gap:8px;flex:none}
.tile{
  flex:1;min-width:0;
  background:rgba(22,22,48,.8);
  border:1px solid var(--telaio);border-radius:12px;
  padding:6px 10px 7px;
  display:flex;flex-direction:column;gap:1px;
}
.tile.main{flex:1.5}
.lbl{
  font-family:var(--mono);font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--nebbia);white-space:nowrap;
}
.val{
  font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:19px;font-weight:700;color:var(--avorio);
  white-space:nowrap;overflow:hidden;
}
.tile.main .val{color:var(--ambra);text-shadow:0 0 14px rgba(255,180,84,.35)}

/* ── palco: tieni · pozzo · prossimi ── */
#stage{flex:1;min-height:0;display:flex;gap:10px;justify-content:center}
.col{width:60px;flex:none;display:flex;flex-direction:column;gap:10px;min-height:0}
.mini{
  background:rgba(22,22,48,.8);
  border:1px solid var(--telaio);border-radius:12px;
  padding:7px 0 8px;display:flex;flex-direction:column;align-items:center;gap:6px;
}
.mini .lbl{font-size:8px}
.mini canvas{display:block}
#wellWrap{
  position:relative;flex:none;align-self:flex-start;
  border:1px solid #33336b;border-radius:10px;overflow:hidden;
  background:var(--pozzo);
  box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 0 4px rgba(22,22,48,.55);
}
#well{display:block;touch-action:none}

/* ── velo (pronto / pausa / fine) ── */
#overlay{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:rgba(11,11,25,.82);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  text-align:center;padding:18px;
}
#overlay.nascosto{display:none}
#ovTitle{font-family:var(--mono);font-size:21px;letter-spacing:.06em;color:var(--avorio)}
#ovText{font-size:13px;line-height:1.55;color:var(--nebbia);max-width:24ch}
#ovText strong{color:var(--ambra);font-weight:600}
#ovBtn{
  margin-top:6px;padding:12px 26px;border-radius:999px;
  background:linear-gradient(#ffc476,#f0a03e);color:#241503;
  font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;
  box-shadow:0 6px 22px rgba(255,180,84,.35);
}
#ovBtn:active{transform:translateY(1px)}

/* ── pulsantiera touch ── */
#pads{display:flex;justify-content:space-between;align-items:center;gap:12px;flex:none;padding:0 2px}
.pad{display:flex;gap:10px;align-items:center}
.key{
  width:58px;height:58px;border-radius:50%;
  background:linear-gradient(#222244,#151530);
  border:1px solid #34346a;
  color:var(--avorio);font-size:22px;line-height:1;
  display:grid;place-items:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 4px 14px rgba(0,0,0,.4);
  touch-action:none;
}
.key:active{transform:translateY(1px);background:linear-gradient(#2b2b56,#1b1b3a);border-color:#4a4a90}
.pad.azioni .key{color:var(--ambra);font-size:20px}
.pad.azioni{display:grid;grid-template-columns:repeat(2,48px);gap:8px}
.pad.azioni .key{width:48px;height:48px}
.hint{
  flex:none;text-align:center;
  font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--nebbia);
}
@media (hover:hover) and (pointer:fine){#pads{display:none}}
@media (max-height:640px){.hint{display:none}}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <canvas id="logo" width="10" height="10" aria-label="Tetris"></canvas>
    <div class="hdr-btns">
      <button id="btnSound" class="chip" aria-label="Attiva o disattiva audio">♪</button>
      <button id="btnPause" class="chip" aria-label="Pausa">❚❚</button>
    </div>
  </header>

  <section id="hud" aria-label="Punteggio">
    <div class="tile main"><span class="lbl">Punti</span><span class="val" id="vScore">0</span></div>
    <div class="tile"><span class="lbl">Record</span><span class="val" id="vBest">0</span></div>
    <div class="tile"><span class="lbl">Livello</span><span class="val" id="vLevel">1</span></div>
    <div class="tile"><span class="lbl">Linee</span><span class="val" id="vLines">0</span></div>
  </section>

  <section id="stage">
    <aside class="col">
      <div class="mini"><span class="lbl">Tieni</span><canvas id="cvHold" width="10" height="10"></canvas></div>
    </aside>
    <div id="wellWrap">
      <canvas id="well" width="10" height="10"></canvas>
      <div id="overlay">
        <div id="ovTitle">Pronto?</div>
        <p id="ovText"></p>
        <button id="ovBtn">Gioca</button>
      </div>
    </div>
    <aside class="col">
      <div class="mini"><span class="lbl">Prossimi</span><canvas id="cvNext" width="10" height="10"></canvas></div>
    </aside>
  </section>

  <section id="pads" aria-label="Comandi">
    <div class="pad">
      <button class="key" data-act="left"  aria-label="Sposta a sinistra">◀</button>
      <button class="key" data-act="down"  aria-label="Scendi">▼</button>
      <button class="key" data-act="right" aria-label="Sposta a destra">▶</button>
    </div>
    <div class="pad azioni">
      <button class="key" data-act="ccw"  aria-label="Ruota in senso antiorario">⟲</button>
      <button class="key" data-act="cw"   aria-label="Ruota in senso orario">⟳</button>
      <button class="key" data-act="hold" aria-label="Tieni il pezzo">⇄</button>
      <button class="key" data-act="drop" aria-label="Cala subito">⤓</button>
    </div>
  </section>
  <p class="hint" id="hint"></p>
</div>

<script>
'use strict';
/* ═══════════════ TETRIS ═══════════════
   Regole moderne: rotazione SRS con wall kick, sacchetto da 7,
   ghost piece, tieni, 3 prossimi, lock delay, curva di velocità
   guideline, punteggio 100/300/500/800 × livello. */

const COLS=10, ROWS=20, HIDDEN=2, TOTAL=ROWS+HIDDEN;
const DAS=170, ARR=40, LOCK_MS=500, LOCK_RESETS=15, CLEAR_MS=300, SOFT_MS=45;

/* pezzi: I J L O S T Z */
const COLORS=['#46c8e0','#4e6be0','#e8923c','#e8c63c','#58c86e','#a868e0','#e05868'];
const BASE=[
  {n:4,c:[[0,1],[1,1],[2,1],[3,1]]},          /* I */
  {n:3,c:[[0,0],[0,1],[1,1],[2,1]]},          /* J */
  {n:3,c:[[2,0],[0,1],[1,1],[2,1]]},          /* L */
  {n:2,c:[[0,0],[1,0],[0,1],[1,1]]},          /* O */
  {n:3,c:[[1,0],[2,0],[0,1],[1,1]]},          /* S */
  {n:3,c:[[1,0],[0,1],[1,1],[2,1]]},          /* T */
  {n:3,c:[[0,0],[1,0],[1,1],[2,1]]}           /* Z */
];
/* le 4 rotazioni di ogni pezzo, precalcolate (rotazione oraria nel box n×n) */
const SHAPES=BASE.map(({n,c})=>{
  const states=[c];
  for(let r=1;r<4;r++) states.push(states[r-1].map(([x,y])=>[n-1-y,x]));
  return states;
});
/* wall kick SRS (convenzione guideline, y verso l'alto: da negare) */
const KICKS_JLSTZ={
  '0>1':[[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]], '1>0':[[0,0],[1,0],[1,-1],[0,2],[1,2]],
  '1>2':[[0,0],[1,0],[1,-1],[0,2],[1,2]],     '2>1':[[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],
  '2>3':[[0,0],[1,0],[1,1],[0,-2],[1,-2]],    '3>2':[[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],
  '3>0':[[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],  '0>3':[[0,0],[1,0],[1,1],[0,-2],[1,-2]]
};
const KICKS_I={
  '0>1':[[0,0],[-2,0],[1,0],[-2,-1],[1,2]],   '1>0':[[0,0],[2,0],[-1,0],[2,1],[-1,-2]],
  '1>2':[[0,0],[-1,0],[2,0],[-1,2],[2,-1]],   '2>1':[[0,0],[1,0],[-2,0],[1,-2],[-2,1]],
  '2>3':[[0,0],[2,0],[-1,0],[2,1],[-1,-2]],   '3>2':[[0,0],[-2,0],[1,0],[-2,-1],[1,2]],
  '3>0':[[0,0],[1,0],[-2,0],[1,-2],[-2,1]],   '0>3':[[0,0],[-1,0],[2,0],[-1,2],[2,-1]]
};

const $=s=>document.querySelector(s);
const wellCv=$('#well'), holdCv=$('#cvHold'), nextCv=$('#cvNext'), logoCv=$('#logo');
const wctx=wellCv.getContext('2d'), hctx=holdCv.getContext('2d'), nctx=nextCv.getContext('2d');
const overlay=$('#overlay'), ovTitle=$('#ovTitle'), ovText=$('#ovText'), ovBtn=$('#ovBtn');

const store={
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};

/* ── stato ── */
let board, cur, holdKind=null, canHold=true, bag=[], queue=[];
let score=0, lines=0, level=1, best=store.get('tetris_record',0);
let phase='ready';               /* ready | playing | clearing | paused | over */
let pausedFrom='playing';
let dropAcc=0, softHeld=false, softScored=false;
let lockAt=null, lockResets=0, lowestY=0;
let das={dir:0,t0:0,last:0};
let clearing={rows:[],t:0};
let newRecord=false;

/* ── suono (WebAudio, bip generati) ── */
let actx=null, muted=store.get('tetris_muted',false);
function tone(f,dur,delay,type,gain){
  if(muted||!actx)return;
  const t0=actx.currentTime+(delay||0);
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type||'square'; o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(gain||0.1,t0+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g).connect(actx.destination);
  o.start(t0); o.stop(t0+dur+0.05);
}
const sfx={
  move(){tone(196,.03,0,'square',.04)},
  rotate(){tone(311,.04,0,'square',.06)},
  lock(){tone(147,.06,0,'triangle',.12)},
  hard(){tone(98,.07,0,'triangle',.16);tone(196,.04,.02,'square',.06)},
  hold(){tone(262,.05,0,'sine',.1)},
  clear(n){
    const arp=n>=4?[392,523,659,784,1047]:[392,523,659];
    arp.forEach((f,i)=>tone(f,.09,i*.055,'square',.09));
  },
  level(){tone(523,.08,0,'square',.09);tone(784,.1,.09,'square',.09)},
  over(){[330,262,196,131].forEach((f,i)=>tone(f,.14,i*.13,'triangle',.11))}
};
function wakeAudio(){
  if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(actx&&actx.state==='suspended')actx.resume();
}

/* ── logica ── */
function refill(){
  if(queue.length>=7)return;
  const b=[0,1,2,3,4,5,6];
  for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}
  queue.push(...b);
}
function cellsOf(p){return SHAPES[p.kind][p.rot].map(([x,y])=>[p.x+x,p.y+y]);}
function collides(p){
  for(const[bx,by]of cellsOf(p)){
    if(bx<0||bx>=COLS||by>=TOTAL)return true;
    if(by>=0&&board[by][bx])return true;
  }
  return false;
}
function grounded(){return collides({...cur,y:cur.y+1});}
function spawn(kind){
  cur={kind,rot:0,x:kind===3?4:3,y:HIDDEN-1};
  dropAcc=0; lockAt=null; lockResets=0; lowestY=cur.y;
  if(collides(cur)){gameOver();return false;}
  drawSide();
  return true;
}
function nextPiece(){refill();return spawn(queue.shift());}
function onMoved(){
  /* un movimento riuscito mentre il pezzo è appoggiato rinnova il lock delay */
  if(lockAt!==null){
    if(lockResets<LOCK_RESETS){lockAt=performance.now();lockResets++;}
  }
  if(!grounded())lockAt=null;
}
function tryShift(dx){
  if(phase!=='playing')return false;
  const p={...cur,x:cur.x+dx};
  if(collides(p))return false;
  cur=p; onMoved(); sfx.move(); return true;
}
function rotate(dir){
  if(phase!=='playing'||cur.kind===3)return;
  const from=cur.rot,to=(from+dir+4)%4;
  const table=cur.kind===0?KICKS_I:KICKS_JLSTZ;
  for(const[kx,ky]of table[from+'>'+to]){
    const p={...cur,rot:to,x:cur.x+kx,y:cur.y-ky};
    if(!collides(p)){cur=p;onMoved();sfx.rotate();return;}
  }
}
function softStep(){
  if(phase!=='playing')return false;
  const p={...cur,y:cur.y+1};
  if(collides(p))return false;
  cur=p; score++; syncHud();
  if(cur.y>lowestY){lowestY=cur.y;lockResets=0;}
  lockAt=null;
  return true;
}
function gravityStep(){
  const p={...cur,y:cur.y+1};
  if(!collides(p)){
    cur=p;
    if(softHeld){score++;syncHud();}
    if(cur.y>lowestY){lowestY=cur.y;lockResets=0;}
    lockAt=null;
  }else if(lockAt===null){
    lockAt=performance.now();
  }
}
function hardDrop(){
  if(phase!=='playing')return;
  let d=0;
  while(!collides({...cur,y:cur.y+1})){cur.y++;d++;}
  score+=2*d; syncHud(); sfx.hard(); lockPiece();
}
function holdPiece(){
  if(phase!=='playing'||!canHold)return;
  wakeAudio(); sfx.hold();
  const k=cur.kind;
  canHold=false;
  if(holdKind===null){holdKind=k;nextPiece();}
  else{const h=holdKind;holdKind=k;spawn(h);}
  drawSide();
}
function lockPiece(){
  let above=true;
  for(const[bx,by]of cellsOf(cur)){
    if(by>=HIDDEN)above=false;
    if(by<0){gameOver();return;}
    board[by][bx]=cur.kind+1;
  }
  if(above){gameOver();return;}          /* lock out: tutto sopra il pozzo */
  canHold=true;
  const full=[];
  for(let y=0;y<TOTAL;y++)if(board[y].every(v=>v))full.push(y);
  if(full.length){
    phase='clearing'; clearing={rows:full,t:0};
    sfx.clear(full.length);
  }else{
    sfx.lock(); nextPiece();
  }
}
function finishClear(){
  const set=new Set(clearing.rows);
  board=board.filter((_,y)=>!set.has(y));
  while(board.length<TOTAL)board.unshift(Array(COLS).fill(0));
  const n=clearing.rows.length;
  score+=[0,100,300,500,800][n]*level;
  lines+=n;
  const nl=Math.floor(lines/10)+1;
  if(nl>level){level=nl;sfx.level();}
  syncHud();
  phase='playing';
  nextPiece();
}
function gravityMs(){
  const l=Math.min(level,20);
  return Math.max(8,1000*Math.pow(0.8-(l-1)*0.007,l-1));
}
function gameOver(){
  phase='over';
  newRecord=score>best&&score>0;
  if(newRecord){best=score;store.set('tetris_record',best);}
  syncHud(); sfx.over(); showOverlay();
}
function newGame(){
  board=Array.from({length:TOTAL},()=>Array(COLS).fill(0));
  bag=[];queue=[];holdKind=null;canHold=true;
  score=0;lines=0;level=1;newRecord=false;
  softHeld=false;das.dir=0;
  refill();syncHud();
  phase='playing';
  nextPiece();
  hideOverlay();
}
function togglePause(){
  if(phase==='playing'||phase==='clearing'){
    pausedFrom=phase;phase='paused';showOverlay();
  }else if(phase==='paused'){
    phase=pausedFrom;hideOverlay();
  }
}

/* ── ciclo ── */
let lastTs=0;
function loop(ts){
  const dt=Math.min(100,ts-lastTs||16);
  lastTs=ts;
  if(phase==='playing'){
    /* auto-ripetizione laterale (DAS/ARR) */
    if(das.dir){
      const now=performance.now();
      if(now-das.t0>=DAS){
        let guard=0;
        while(now-das.last>=ARR&&guard++<COLS){
          if(!tryShift(das.dir)){das.last=now;break;}
          das.last+=ARR;
        }
      }
    }
    const interval=softHeld?Math.min(gravityMs(),SOFT_MS):gravityMs();
    dropAcc+=dt;
    let guard=0;
    while(dropAcc>=interval&&guard++<TOTAL){dropAcc-=interval;gravityStep();if(phase!=='playing')break;}
    if(phase==='playing'&&lockAt!==null&&performance.now()-lockAt>=LOCK_MS)lockPiece();
  }else if(phase==='clearing'){
    clearing.t+=dt;
    if(clearing.t>=CLEAR_MS)finishClear();
  }
  draw();
  requestAnimationFrame(loop);
}

/* ── resa grafica ── */
let cell=24,dpr=1,sprites=[],ghosts=[];
function roundRect(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();
}
function makeSprite(px,color,ghost){
  const cv=document.createElement('canvas');cv.width=cv.height=px;
  const g=cv.getContext('2d');
  const m=Math.max(1,px*0.045), r=Math.max(2,px*0.18), w=px-2*m;
  roundRect(g,m,m,w,w,r);
  if(ghost){
    g.fillStyle=color+'1c';g.fill();
    g.lineWidth=Math.max(1.5,px*0.07);g.strokeStyle=color+'99';g.stroke();
    return cv;
  }
  g.fillStyle=color;g.fill();
  let gr=g.createLinearGradient(0,m,0,m+w);
  gr.addColorStop(0,'rgba(255,255,255,.32)');gr.addColorStop(.42,'rgba(255,255,255,.04)');
  gr.addColorStop(.68,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.28)');
  roundRect(g,m,m,w,w,r);g.fillStyle=gr;g.fill();
  g.lineWidth=1;g.strokeStyle='rgba(0,0,0,.35)';g.stroke();
  return cv;
}
function rebuildSprites(){
  const px=Math.round(cell*dpr);
  sprites=COLORS.map(c=>makeSprite(px,c,false));
  ghosts=COLORS.map(c=>makeSprite(px,c,true));
}
function layout(){
  dpr=window.devicePixelRatio||1;
  const stage=$('#stage');
  const availW=stage.clientWidth-2*70, availH=stage.clientHeight-2;
  cell=Math.max(13,Math.floor(Math.min(availW/COLS,availH/ROWS)));
  const W=cell*COLS,H=cell*ROWS;
  const wrap=$('#wellWrap');
  wrap.style.width=W+'px';wrap.style.height=H+'px';
  wellCv.style.width=W+'px';wellCv.style.height=H+'px';
  wellCv.width=Math.round(W*dpr);wellCv.height=Math.round(H*dpr);
  sizeMini(holdCv,52,52);sizeMini(nextCv,52,150);
  rebuildSprites();drawLogo();drawSide();
}
function sizeMini(cv,w,h){
  cv.style.width=w+'px';cv.style.height=h+'px';
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
}
function drawCellAt(g,x,y,kind,ghost){
  const px=Math.round(cell*dpr);
  g.drawImage(ghost?ghosts[kind]:sprites[kind],Math.round(x*px),Math.round(y*px),px,px);
}
function draw(){
  const W=wellCv.width,H=wellCv.height,px=Math.round(cell*dpr);
  wctx.clearRect(0,0,W,H);
  /* griglia sottile */
  wctx.strokeStyle='rgba(234,231,219,.045)';wctx.lineWidth=1;
  wctx.beginPath();
  for(let x=1;x<COLS;x++){wctx.moveTo(x*px+.5,0);wctx.lineTo(x*px+.5,H);}
  for(let y=1;y<ROWS;y++){wctx.moveTo(0,y*px+.5);wctx.lineTo(W,y*px+.5);}
  wctx.stroke();
  /* blocchi fissati */
  for(let y=HIDDEN;y<TOTAL;y++)for(let x=0;x<COLS;x++){
    const v=board&&board[y][x];
    if(v)drawCellAt(wctx,x,y-HIDDEN,v-1,false);
  }
  if(cur&&(phase==='playing'||phase==='paused')){
    /* ghost */
    const g={...cur};
    while(!collides({...g,y:g.y+1}))g.y++;
    if(g.y>cur.y)for(const[bx,by]of cellsOf(g))if(by>=HIDDEN)drawCellAt(wctx,bx,by-HIDDEN,cur.kind,true);
    /* pezzo attivo */
    for(const[bx,by]of cellsOf(cur))if(by>=HIDDEN)drawCellAt(wctx,bx,by-HIDDEN,cur.kind,false);
  }
  /* lampo di cancellazione */
  if(phase==='clearing'){
    const a=.2+.75*Math.abs(Math.sin(clearing.t/CLEAR_MS*Math.PI*3));
    wctx.fillStyle='rgba(234,231,219,'+a.toFixed(3)+')';
    for(const y of clearing.rows)if(y>=HIDDEN)wctx.fillRect(0,(y-HIDDEN)*px,W,px);
  }
}
function drawMiniPiece(g,kind,cx,cy,m){
  const cs=SHAPES[kind][0];
  let minX=9,maxX=-9,minY=9,maxY=-9;
  for(const[x,y]of cs){minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);}
  const w=(maxX-minX+1)*m,h=(maxY-minY+1)*m;
  for(const[x,y]of cs){
    const px=cx-w/2+(x-minX)*m, py=cy-h/2+(y-minY)*m;
    roundRect(g,px+m*.06,py+m*.06,m*.88,m*.88,m*.2);
    g.fillStyle=COLORS[kind];g.fill();
    g.fillStyle='rgba(255,255,255,.25)';
    g.fillRect(px+m*.14,py+m*.12,m*.72,m*.14);
    g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=1;g.stroke();
  }
}
function drawSide(){
  hctx.setTransform(dpr,0,0,dpr,0,0);hctx.clearRect(0,0,200,200);
  if(holdKind!==null){
    hctx.globalAlpha=canHold?1:.38;
    drawMiniPiece(hctx,holdKind,26,26,11);
    hctx.globalAlpha=1;
  }
  nctx.setTransform(dpr,0,0,dpr,0,0);nctx.clearRect(0,0,200,300);
  for(let i=0;i<3;i++){
    if(queue[i]===undefined)break;
    drawMiniPiece(nctx,queue[i],26,25+i*50,11);
  }
}
/* wordmark: lettere costruite con le tessere del gioco */
const GLYPHS={
  T:['111','010','010','010','010'],E:['111','100','110','100','111'],
  R:['110','101','110','101','101'],I:['111','010','010','010','111'],
  S:['011','100','010','001','110']
};
function drawLogo(){
  const word='TETRIS', pal=[5,0,3,6,4,1], u=6;
  const wCells=word.length*4-1;
  logoCv.style.width=(wCells*u)+'px';logoCv.style.height=(5*u)+'px';
  logoCv.width=Math.round(wCells*u*dpr);logoCv.height=Math.round(5*u*dpr);
  const g=logoCv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);
  let ox=0;
  for(let i=0;i<word.length;i++){
    const rows=GLYPHS[word[i]], color=COLORS[pal[i]];
    for(let y=0;y<5;y++)for(let x=0;x<3;x++){
      if(rows[y][x]==='1'){
        roundRect(g,ox+x*u+.4,y*u+.4,u-.8,u-.8,1.6);
        g.fillStyle=color;g.fill();
        g.fillStyle='rgba(255,255,255,.28)';
        g.fillRect(ox+x*u+1.1,y*u+1,u-2.2,1.4);
      }
    }
    ox+=4*u;
  }
}

/* ── HUD e veli ── */
const vScore=$('#vScore'),vBest=$('#vBest'),vLevel=$('#vLevel'),vLines=$('#vLines');
let hudCache='';
function syncHud(){
  const s=score+'|'+best+'|'+level+'|'+lines;
  if(s===hudCache)return;hudCache=s;
  vScore.textContent=score.toLocaleString('it-IT');
  vBest.textContent=best.toLocaleString('it-IT');
  vScore.style.fontSize=score>=100000?'15px':'';
  vBest.style.fontSize=best>=100000?'15px':'';
  vLevel.textContent=level;
  vLines.textContent=lines;
  drawSide();
}
const isTouch=matchMedia('(pointer:coarse)').matches;
function showOverlay(){
  overlay.classList.remove('nascosto');
  if(phase==='ready'){
    ovTitle.textContent='Pronto?';
    ovText.innerHTML=isTouch
      ?'Trascina sul pozzo per muovere, tocca per ruotare, trascina in giù per calare in fondo.'
      :'Frecce per muovere, <strong>↑</strong> ruota, <strong>spazio</strong> cala, <strong>C</strong> tiene, <strong>P</strong> pausa.';
    ovBtn.textContent='Gioca';
  }else if(phase==='paused'){
    ovTitle.textContent='In pausa';
    ovText.textContent='Il pozzo ti aspetta.';
    ovBtn.textContent='Riprendi';
  }else if(phase==='over'){
    ovTitle.textContent='Fine partita';
    ovText.innerHTML=(newRecord?'<strong>Nuovo record!</strong> ':'')+
      'Hai totalizzato <strong>'+score.toLocaleString('it-IT')+'</strong> punti con '+lines+' linee.';
    ovBtn.textContent='Gioca ancora';
  }
}
function hideOverlay(){overlay.classList.add('nascosto');}
ovBtn.addEventListener('click',()=>{
  wakeAudio();
  if(phase==='paused')togglePause();else newGame();
});
$('#btnPause').addEventListener('click',()=>{wakeAudio();if(phase!=='ready'&&phase!=='over')togglePause();});
const btnSound=$('#btnSound');
function syncSound(){btnSound.textContent=muted?'∅':'♪';btnSound.style.color=muted?'var(--nebbia)':'var(--ambra)';}
btnSound.addEventListener('click',()=>{muted=!muted;store.set('tetris_muted',muted);wakeAudio();syncSound();});
syncSound();

/* ── tastiera ── */
addEventListener('keydown',e=>{
  if(e.repeat&&['ArrowLeft','ArrowRight','ArrowDown'].indexOf(e.code)===-1)return;
  wakeAudio();
  switch(e.code){
    case 'ArrowLeft': if(!e.repeat){das={dir:-1,t0:performance.now(),last:performance.now()+DAS-ARR};tryShift(-1);} e.preventDefault();break;
    case 'ArrowRight':if(!e.repeat){das={dir:1,t0:performance.now(),last:performance.now()+DAS-ARR};tryShift(1);} e.preventDefault();break;
    case 'ArrowDown': softHeld=true;e.preventDefault();break;
    case 'ArrowUp': case 'KeyX': if(!e.repeat)rotate(1);e.preventDefault();break;
    case 'KeyZ': if(!e.repeat)rotate(-1);break;
    case 'Space': if(!e.repeat)hardDrop();e.preventDefault();break;
    case 'KeyC': if(!e.repeat)holdPiece();break;
    case 'KeyP': case 'Escape': if(phase!=='ready'&&phase!=='over')togglePause();break;
    case 'Enter': if(phase==='ready'||phase==='over')newGame();else if(phase==='paused')togglePause();break;
  }
});
addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft'&&das.dir===-1)das.dir=0;
  if(e.code==='ArrowRight'&&das.dir===1)das.dir=0;
  if(e.code==='ArrowDown')softHeld=false;
});

/* ── pulsantiera ── */
document.querySelectorAll('.key').forEach(btn=>{
  const act=btn.dataset.act;
  btn.addEventListener('contextmenu',e=>e.preventDefault());
  btn.addEventListener('pointerdown',e=>{
    e.preventDefault();wakeAudio();
    try{btn.setPointerCapture(e.pointerId)}catch(err){}
    if(act==='left'){das={dir:-1,t0:performance.now(),last:performance.now()+DAS-ARR};tryShift(-1);}
    else if(act==='right'){das={dir:1,t0:performance.now(),last:performance.now()+DAS-ARR};tryShift(1);}
    else if(act==='down')softHeld=true;
    else if(act==='cw')rotate(1);
    else if(act==='ccw')rotate(-1);
    else if(act==='drop')hardDrop();
    else if(act==='hold')holdPiece();
  });
  const stop=()=>{
    if(act==='left'&&das.dir===-1)das.dir=0;
    if(act==='right'&&das.dir===1)das.dir=0;
    if(act==='down')softHeld=false;
  };
  btn.addEventListener('pointerup',stop);
  btn.addEventListener('pointercancel',stop);
});

/* ── gesti sul pozzo ── */
let touch=null;
wellCv.addEventListener('pointerdown',e=>{
  if(phase!=='playing')return;
  wakeAudio();e.preventDefault();
  try{wellCv.setPointerCapture(e.pointerId)}catch(err){}
  touch={id:e.pointerId,x0:e.clientX,y0:e.clientY,lx:e.clientX,t0:performance.now(),moved:false,dropped:false,hs:0};
});
wellCv.addEventListener('pointermove',e=>{
  if(!touch||e.pointerId!==touch.id||phase!=='playing'||touch.dropped)return;
  /* trascinamento netto verso il basso = il pezzo cala subito in fondo */
  const totDx=e.clientX-touch.x0, totDy=e.clientY-touch.y0;
  if(touch.hs===0&&totDy>=Math.max(48,cell*1.5)&&totDy>1.5*Math.abs(totDx)){
    touch.dropped=true;hardDrop();return;
  }
  const step=cell*0.72;
  let dx=e.clientX-touch.lx;
  while(dx>=step){if(tryShift(1)){touch.lx+=step;dx-=step;touch.moved=true;touch.hs++;}else{touch.lx=e.clientX;dx=0;}}
  while(dx<=-step){if(tryShift(-1)){touch.lx-=step;dx+=step;touch.moved=true;touch.hs++;}else{touch.lx=e.clientX;dx=0;}}
  if(Math.abs(totDx)>12||Math.abs(totDy)>12)touch.moved=true;
});
wellCv.addEventListener('pointerup',e=>{
  if(!touch||e.pointerId!==touch.id)return;
  const dt=performance.now()-touch.t0;
  if(phase==='playing'&&!touch.dropped&&!touch.moved&&dt<260)rotate(1);
  touch=null;
});
wellCv.addEventListener('pointercancel',()=>{touch=null;});

/* pausa automatica quando la pagina passa in secondo piano */
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&(phase==='playing'||phase==='clearing'))togglePause();
});

$('#hint').textContent=isTouch
  ?'Trascina per muovere · tocca per ruotare · trascina giù per calare in fondo'
  :'← → muovi · ↓ scende · ↑/X ruota · Z ruota ⟲ · spazio cala · C tiene · P pausa';

/* ── avvio ── */
board=Array.from({length:TOTAL},()=>Array(COLS).fill(0));
new ResizeObserver(()=>layout()).observe($('#stage'));
addEventListener('resize',layout);
layout();
syncHud();
showOverlay();
requestAnimationFrame(loop);
</script>
</body>
</html>
