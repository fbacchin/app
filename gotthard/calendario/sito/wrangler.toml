name = "gottardo-calendario"
main = "worker.js"
compatibility_date = "2026-10-01"

# Solo il dominio protetto da Cloudflare Access: l'indirizzo *.workers.dev e le anteprime restano spenti.
workers_dev = false
preview_urls = false

routes = [
  { pattern = "calendario.bacchin.app", custom_domain = true }
]

# La pagina e' un file HTML importato come testo.
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# Segreto (non qui): GITHUB_TOKEN, token GitHub con scrittura su fbacchin/app.
