name: Collect Gotthard history

# GitHub esegue i cron "best effort" e ritarda anche di ore quelli frequenti.
# Strategia: run lunghi che campionano in loop ogni 5 minuti per ~3 ore e
# committano a ogni campione; il gruppo di concorrenza incatena i run in coda.
# Sync col remoto via fetch+reset a inizio giro (mai pull/merge: un merge
# conflittuale aveva committato marcatori <<<<<<< dentro il JSON corrompendolo).
#
# Se il push viene rifiutato si RITENTA con un rebase, invece di buttare il
# giro (ADEV-678). Il rifiuto e' quasi sempre valichi-collect, che pusha sullo
# stesso main alla stessa cadenza: 1-2 volte ogni run da 3 ore. Buttare il giro
# non perde solo un campione: perde push-state.json, e il giro dopo rimanda la
# stessa notifica. E' cosi' che il 12.09.2026 «tunnel reopened» e' arrivato due
# volte, alle 13:01 e alle 13:06 UTC.
# Il rebase qui e' sicuro perche' l'altro workflow scrive solo in valichi/, e
# noi solo in gotthard/data/: non possono confliggere. Se un conflitto ci fosse
# comunque, `git rebase` si ferma senza committare niente, lo si annulla, e si
# ricade nel comportamento di prima.
#
# A fine run il job `next` lancia da solo il run successivo (workflow_dispatch).
# Il cron da solo non bastava: il 14.09.2026 fra un run e l'altro ci sono stati
# buchi di 3 ore, e il 15.09 il run finito alle 05:41 UTC alle 07:55 non aveva
# ancora un successore.
# Il GITHUB_TOKEN puo' farlo: gli eventi del token non creano run, TRANNE
# workflow_dispatch e repository_dispatch (docs GitHub, "Triggering a workflow
# from a workflow"). Il run lanciato resta `pending` nel gruppo di concorrenza
# finche' questo non finisce, quindi non ne girano mai due insieme; se nel
# frattempo arriva un cron, uno dei due pending viene cancellato e ne resta uno.
# Il cron rimane come rete di sicurezza se la catena si interrompe.
# Annullare a mano un run ferma la catena (`!cancelled()`); per fermarla del
# tutto: `gh workflow disable gotthard-collect.yml -R fbacchin/app`.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gotthard-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 178
    steps:
      - uses: actions/checkout@v5

      - name: Sample every 5 minutes for ~3 hours
        env:
          OTD_API_KEY: ${{ secrets.OTD_API_KEY }}
          B4A_APP_ID: ${{ secrets.B4A_APP_ID }}
          B4A_MASTER_KEY: ${{ secrets.B4A_MASTER_KEY }}
        run: |
          git config user.name "gottardo-bot"
          git config user.email "actions@users.noreply.github.com"
          for i in $(seq 1 34); do
            git fetch origin main && git reset --hard origin/main
            if python3 gotthard/collect.py; then
              git add gotthard/data/
              git diff --cached --quiet || git commit -m "gotthard sample $(date -u +%FT%TZ)"
              if ! git push origin main; then
                salvato=""
                for tentativo in 1 2 3; do
                  sleep $((tentativo * 5))
                  if git fetch origin main && git rebase origin/main && git push origin main; then
                    salvato="si"
                    echo "push riuscito al tentativo $tentativo dopo rebase"
                    break
                  fi
                  git rebase --abort 2>/dev/null || true
                done
                [ -n "$salvato" ] || echo "push fallito dopo 3 tentativi, campione perso: riprovo al prossimo giro"
              fi
            fi
            if [ "$i" -lt 34 ]; then sleep 300; fi
          done

  next:
    needs: collect
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Queue the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run gotthard-collect.yml --ref main -R "$GITHUB_REPOSITORY"
