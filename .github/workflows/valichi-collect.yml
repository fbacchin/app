name: Collect valichi history

# Stessa strategia del collector del Gottardo (vedi gotthard-collect.yml):
# i cron di GitHub sono "best effort", quindi run lunghi ~3 ore che
# campionano in loop e committano a ogni giro, incatenati dal gruppo di
# concorrenza. A inizio giro il sync col remoto è fetch+reset.
#
# Se il push viene rifiutato si RITENTA con un rebase, invece di buttare il
# giro. Questo workflow e gotthard-collect.yml pushano sullo stesso main a
# cadenze che si incrociano: quando l'altro pusha fra il nostro fetch e il
# nostro push, il push viene rifiutato ("fetch first", oppure "cannot lock
# ref" se i due arrivano insieme). Buttare il giro perde il campione e,
# peggio, perde push-state.json: il giro dopo riparte dalla fase vecchia e
# RIMANDA la stessa notifica. Sul Gottardo è successo il 12.09.2026 (due
# «reopened» a 5 minuti); qui, fra il 12 e il 14.09, 8 giri persi su 187,
# per fortuna con le notifiche ancora spente.
#
# Un tempo la regola era "mai pull/rebase", dopo un merge conflittuale che
# aveva scritto marcatori <<<<<<< dentro un JSON del Gottardo. Il rebase qui
# è sicuro per un motivo preciso: questo workflow scrive solo i quattro file
# di valichi/data/ elencati nel git add, il Gottardo solo gotthard/data/, e
# due commit che toccano cartelle disgiunte non possono andare in conflitto.
# Se un conflitto ci fosse comunque, `git rebase` si ferma SENZA committare
# niente, lo si annulla con --abort e si ricade nel comportamento di prima:
# giro perso, ma nessun JSON corrotto.
#
# Cadenza 10 minuti, non 5: le fonti di frontiera si aggiornano più
# lentamente del feed svizzero (granica dichiara 8 aggiornamenti al giorno)
# e sono siti pubblici da non martellare.
#
# NB: gli scheduled workflow girano solo dal branch di default — questo
# file si attiva quando arriva su main.
#
# A fine run il job `next` lancia da solo il run successivo (workflow_dispatch),
# come in gotthard-collect.yml: il cron da solo lasciava buchi anche di ore.
# Il GITHUB_TOKEN puo' farlo perche' workflow_dispatch e' un'eccezione alla
# regola "gli eventi del token non creano run". Il run lanciato resta `pending`
# nel gruppo di concorrenza finche' questo non finisce: mai due insieme. Il cron
# resta come rete di sicurezza.
#
# FRENO: il successivo parte solo se la raccolta e' finita BENE. Un run che
# fallisce subito, rilanciato, diventerebbe un run fallito al minuto
# all'infinito; cosi' invece la catena si ferma e la riprende il cron. Annullare
# a mano un run ferma la catena allo stesso modo; per fermarla del tutto:
# `gh workflow disable valichi-collect.yml -R fbacchin/app`.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: valichi-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 178
    steps:
      - uses: actions/checkout@v5

      - name: Sample every 10 minutes for ~3 hours
        env:
          # Push opzionali: senza questi secrets il collector raccoglie e
          # basta. App Back4App SEPARATA da quella di Gottardo Live: canali
          # per valico, pubblico diverso.
          B4A_VALICHI_APP_ID: ${{ secrets.B4A_VALICHI_APP_ID }}
          B4A_VALICHI_MASTER_KEY: ${{ secrets.B4A_VALICHI_MASTER_KEY }}
        run: |
          git config user.name "valichi-bot"
          git config user.email "actions@users.noreply.github.com"
          for i in $(seq 1 17); do
            git fetch origin main && git reset --hard origin/main
            if python3 valichi/collect.py; then
              # File elencati ESPLICITAMENTE: un file dati nuovo va aggiunto
              # qui, altrimenti nasce a ogni giro e muore al reset successivo
              # senza mai arrivare su GitHub (successo due volte al Gottardo).
              git add valichi/data/latest.json valichi/data/history.json valichi/data/push-state.json valichi/data/sources-log.jsonl
              git diff --cached --quiet || git commit -m "valichi sample $(date -u +%FT%TZ)"
              if ! git push origin main; then
                salvato=""
                for tentativo in 1 2 3; do
                  sleep $((tentativo * 5))
                  if git fetch origin main && git rebase origin/main && git push origin main; then
                    salvato="si"
                    echo "push riuscito al tentativo $tentativo dopo rebase"
                    break
                  fi
                  git rebase --abort 2>/dev/null || true
                done
                [ -n "$salvato" ] || echo "push fallito dopo 3 tentativi, campione perso: riprovo al prossimo giro"
              fi
            fi
            if [ "$i" -lt 17 ]; then sleep 600; fi
          done

  next:
    needs: collect
    if: ${{ needs.collect.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Queue the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run valichi-collect.yml --ref main -R "$GITHUB_REPOSITORY"
