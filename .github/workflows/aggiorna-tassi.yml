name: Aggiorna tassi

# Parte dal collector Gotthard (gotthard-collect.yml) alle 13:10 svizzere, quando
# il dato €STR è già uscito. Niente cron: in questo repo GitHub lo ritarda di ore
# o lo salta. Si può lanciare anche a mano (workflow_dispatch).
# Il lavoro è idempotente (aggiunge solo le date mancanti, altrimenti non fa nulla)
# e il log del giorno si accoda a ogni esecuzione.
on:
  workflow_dispatch:         # permette di lanciarlo a mano dal sito di GitHub

permissions:
  contents: write

concurrency:
  group: aggiorna-tassi
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Scarica i tassi e aggiorna i CSV
        run: python3 tools/aggiorna_tassi.py

      - name: Commit e push se ci sono modifiche
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Euribor log
          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare"
            exit 0
          fi
          git commit -m "Aggiorna tassi $(date -u +%d.%m.%Y)"
          # altri workflow del repo fanno push su main di continuo: se il push viene
          # rifiutato si fa rebase (qui si toccano solo Euribor/ e log/) e si riprova
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep $((i * 5))
          done
          echo "Push non riuscito dopo 5 tentativi"
          exit 1
