name: Aggiorna tassi

# Il lancio principale parte dal collector Gotthard (gotthard-collect.yml) alle
# 13:00 svizzere, perché GitHub esegue i cron "best effort" e in questo repo li
# ritarda anche di ore. Il cron qui sotto è solo un ripiego, se quel lancio salta.
# Il lavoro è idempotente (aggiunge solo le date mancanti, altrimenti non fa nulla).
# Orario UTC; il minuto ":07" evita l'ora tonda, la più carica.
on:
  schedule:
    - cron: "7 13 * * *"
  workflow_dispatch:         # permette di lanciarlo a mano dal sito di GitHub

permissions:
  contents: write

concurrency:
  group: aggiorna-tassi
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Scarica i tassi e aggiorna i CSV
        run: python3 tools/aggiorna_tassi.py

      - name: Commit e push se ci sono modifiche
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Euribor log
          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare"
            exit 0
          fi
          git commit -m "Aggiorna tassi $(date -u +%d.%m.%Y)"
          # altri workflow del repo fanno push su main di continuo: se il push viene
          # rifiutato si fa rebase (qui si toccano solo Euribor/ e log/) e si riprova
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep $((i * 5))
          done
          echo "Push non riuscito dopo 5 tentativi"
          exit 1
