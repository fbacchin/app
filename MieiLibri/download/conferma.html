<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email confermata — I miei libri</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0;
         min-height: 100vh; display: grid; place-items: center;
         background: #f7f4ef; color: #2b2118; text-align: center; padding: 24px; }
  .scheda { max-width: 26rem; }
  .segno { width: 84px; height: 84px; border-radius: 50%; margin: 0 auto 20px;
           display: grid; place-items: center; background: #e8f5e0; font-size: 44px; }
  .segno.ko { background: #fbe9e7; }
  h1 { font-size: 1.5rem; margin: 0 0 10px; }
  p { color: #6b5d4d; margin: 0 0 26px; line-height: 1.5; }
  a.bottone { display: inline-block; background: #d97a13; color: #fff; text-decoration: none;
              padding: 14px 32px; border-radius: 999px; font-weight: 600; font-size: 1.05rem; }
  small { display: block; margin-top: 24px; color: #8a7a68; line-height: 1.5; }
  @media (prefers-color-scheme: dark) {
    body { background: #1c1714; color: #f0e8de; }
    p { color: #b3a494; } small { color: #8a7a68; }
    .segno { background: #24331d; } .segno.ko { background: #3a201c; }
  }
</style>
<div class="scheda">
  <div class="segno" id="segno">✓</div>
  <h1 id="titolo">Email confermata</h1>
  <p id="testo">Il tuo account è attivo. Torna nell'app per accedere.</p>
  <a class="bottone" id="apri" href="#">Apri I miei libri</a>
  <small id="nota">Se il pulsante non apre l'app, aprila a mano e premi <b>Accedi</b>
  con le stesse credenziali.</small>
</div>
<script>
  // Supabase restituisce i token (o l'eventuale errore) nel frammento dopo #.
  // Il frammento non viene mai inviato al server: resta nel browser.
  var frammento = location.hash.replace(/^#/, '');
  var campi = {};
  frammento.split('&').forEach(function (coppia) {
    var i = coppia.indexOf('=');
    if (i > 0) campi[coppia.slice(0, i)] = decodeURIComponent(coppia.slice(i + 1).replace(/\+/g, ' '));
  });

  var apri = document.getElementById('apri');
  apri.href = 'mieilibri://conferma' + (frammento ? '#' + frammento : '');

  if (campi.error || campi.error_description) {
    document.getElementById('segno').textContent = '!';
    document.getElementById('segno').className = 'segno ko';
    document.getElementById('titolo').textContent = 'Conferma non riuscita';
    document.getElementById('testo').textContent =
      campi.error_description || campi.error;
    document.getElementById('nota').textContent =
      'Il collegamento potrebbe essere scaduto: riprova la registrazione dall’app.';
  } else if (campi.access_token) {
    document.getElementById('testo').textContent =
      'Il tuo account è attivo. Apri l’app: l’accesso è già fatto.';
    // Tentativo di apertura automatica; se il browser lo blocca resta il pulsante.
    setTimeout(function () { location.href = apri.href; }, 600);
  }
</script>
</html>
