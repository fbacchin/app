  background:radial-gradient(120% 90% at 50% 30%,var(--room) 0%,#020308 100%);
  color:var(--green);
  font-family:var(--px);
  overflow:hidden;
  touch-action:none;
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;
}

/* ============ Layout cabinet ============ */
#cabinet{
  height:100%;
  display:flex;flex-direction:column;align-items:center;
  padding:calc(6px + env(safe-area-inset-top)) calc(6px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) calc(6px + env(safe-area-inset-left));
  gap:8px;
}
#marquee{
  flex:none;
  font-size:13px;letter-spacing:2px;text-align:center;padding-top:6px;
  color:var(--cyan);
  text-shadow:0 0 8px rgba(46,230,255,.9),3px 3px 0 var(--magenta),3px 3px 8px rgba(255,61,240,.7);
}
#marquee small{display:block;font-size:7px;color:#5a637f;text-shadow:none;margin-top:6px;letter-spacing:3px}
#stage{flex:1;align-self:stretch;position:relative;min-height:0}

/* ============ Schermo CRT ============ */
#screen{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  background:#000;
  border:8px solid var(--bezel);
  outline:2px solid var(--bezel-edge);
  border-radius:14px;
  box-shadow:0 0 70px rgba(46,230,255,.10),0 0 24px rgba(0,0,0,.9),inset 0 0 40px rgba(0,0,0,.7);
  overflow:hidden;
}
#game{
  display:block;width:100%;height:100%;
  image-rendering:pixelated;image-rendering:crisp-edges;
  background:#000;
}
#screen .fx{position:absolute;inset:0;pointer-events:none;border-radius:6px}
#screen .scanlines{
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);
  mix-blend-mode:multiply;
}
#screen .rgbmask{
  background:repeating-linear-gradient(to right,rgba(255,0,90,.06) 0 1px,rgba(0,255,140,.05) 1px 2px,rgba(0,120,255,.06) 2px 3px);
}
#screen .vignette{
  background:radial-gradient(ellipse 90% 80% at 50% 48%,transparent 55%,rgba(0,0,0,.5) 100%);
}
#screen .flicker{background:#fff;opacity:0;animation:flick 7s infinite steps(1)}
@keyframes flick{
  0%,93%,100%{opacity:0}
  94%{opacity:.015}95%{opacity:0}
  96.5%{opacity:.02}97%{opacity:0}
}

/* ============ Pulsanti servizio (audio / pausa) ============ */
#sysbtns{position:absolute;top:2px;right:2px;display:flex;gap:6px;z-index:5}
.sysbtn{
  font-family:var(--px);font-size:8px;letter-spacing:1px;
  color:#7f8ab0;background:rgba(8,10,20,.75);
  border:1px solid #2a3350;border-radius:6px;
  padding:8px 9px;cursor:pointer;
}
.sysbtn:active{color:var(--cyan);border-color:var(--cyan)}
.sysbtn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* ============ Controlli touch ============ */
#controls{
  flex:none;align-self:stretch;
  display:none;
  justify-content:space-between;align-items:center;
  padding:2px 10px 6px;
  gap:12px;
}
.padgroup{display:flex;gap:14px}
.padbtn{
  width:72px;height:72px;border-radius:50%;
  border:2px solid #2a3350;
  background:rgba(10,13,26,.85);
  color:var(--cyan);
  font-family:var(--px);font-size:20px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 14px rgba(46,230,255,.12),inset 0 0 12px rgba(0,0,0,.6);
  touch-action:none;
}
.padbtn.fire{
  width:88px;height:88px;
  color:var(--magenta);font-size:10px;letter-spacing:1px;
  border-color:#432a50;
  box-shadow:0 0 16px rgba(255,61,240,.18),inset 0 0 12px rgba(0,0,0,.6);
}
.padbtn.held{border-color:var(--cyan);color:#fff;background:rgba(46,230,255,.14)}
.padbtn.fire.held{border-color:var(--magenta);background:rgba(255,61,240,.16)}
@media (pointer:coarse){
  #controls{display:flex}
  #marquee{display:none}
}

/* ============ Suggerimenti desktop ============ */
#hint{
  flex:none;font-size:7px;letter-spacing:2px;color:#4a5470;padding-bottom:4px;text-align:center;
}
@media (pointer:coarse){#hint{display:none}}
@media (max-height:520px){#marquee{display:none}}

@media (prefers-reduced-motion:reduce){
  #screen .flicker{animation:none}
}

<body>
<div id="cabinet">
  <div id="marquee">LASER INVADERS<small>GALASSIA · 1982</small></div>
  <div id="stage">
    <div id="screen">
      <canvas id="game" width="256" height="320"></canvas>
      <div class="fx rgbmask"></div>
      <div class="fx scanlines"></div>
      <div class="fx vignette"></div>
      <div class="fx flicker"></div>
    </div>
    <div id="sysbtns">
      <button class="sysbtn" id="btnSound" aria-label="Attiva o disattiva audio">AUDIO ON</button>
      <button class="sysbtn" id="btnPause" aria-label="Pausa">PAUSA</button>
    </div>
  </div>
  <div id="controls">
    <div class="padgroup">
      <div class="padbtn" id="btnLeft" aria-label="Sinistra">&#9664;</div>
      <div class="padbtn" id="btnRight" aria-label="Destra">&#9654;</div>
    </div>
    <div class="padbtn fire" id="btnFire" aria-label="Fuoco">FUOCO</div>
  </div>
  <div id="hint">&#9664; &#9654; MUOVI &nbsp;·&nbsp; SPAZIO SPARA &nbsp;·&nbsp; P PAUSA &nbsp;·&nbsp; M AUDIO</div>
</div>

<script>
'use strict';
/* =====================================================================
   LASER INVADERS — sparatutto arcade stile 1982
   Risoluzione logica 256x320, upscaling pixelated, audio Web Audio API.
   ===================================================================== */

const W = 256, H = 320;
const cv = document.getElementById('game');
const cx = cv.getContext('2d');

const COLORS = {
  green:'#39ff6e', cyan:'#2ee6ff', magenta:'#ff3df0',
  amber:'#ffb300', red:'#ff2b4a', white:'#e8f6ff', dim:'#43507a'
};

/* Bande di colore "cellophane": come nei cabinet del 1978-82 il monitor era
   monocromatico con strisce di gelatina colorata — il colore dipende dalla
   riga dello schermo, quindi gli alieni cambiano colore mentre scendono. */
function bandColor(y){
  if (y < 34)  return COLORS.amber;
  if (y < 100) return COLORS.magenta;
  if (y < 170) return COLORS.cyan;
  return COLORS.green;
}

/* ============ Sprite (bitmap in stringhe) ============ */
const SPR = {
  squid: [[
    '...XX...',
    '..XXXX..',
    '.XXXXXX.',
    'XX.XX.XX',
    'XXXXXXXX',
    '..X..X..',
    '.X.XX.X.',
    'X.X..X.X'
  ],[
    '...XX...',
    '..XXXX..',
    '.XXXXXX.',
    'XX.XX.XX',
    'XXXXXXXX',
    '.X.XX.X.',
    'X......X',
    '.X....X.'
  ]],
  crab: [[
    '..X.....X..',
    '...X...X...',
    '..XXXXXXX..',
    '.XX.XXX.XX.',
    'XXXXXXXXXXX',
    'X.XXXXXXX.X',
    'X.X.....X.X',
    '...XX.XX...'
  ],[
    '..X.....X..',
    'X..X...X..X',
    'X.XXXXXXX.X',
    'XXX.XXX.XXX',
    'XXXXXXXXXXX',
    '.XXXXXXXXX.',
    '..X.....X..',
    '.X.......X.'
  ]],
  octo: [[
    '....XXXX....',
    '.XXXXXXXXXX.',
    'XXXXXXXXXXXX',
    'XXX..XX..XXX',
    'XXXXXXXXXXXX',
    '...XX..XX...',
    '..XX.XX.XX..',
    'XX........XX'
  ],[
    '....XXXX....',
    '.XXXXXXXXXX.',
    'XXXXXXXXXXXX',
    'XXX..XX..XXX',
    'XXXXXXXXXXXX',
    '..XXX..XXX..',
    '.XX..XX..XX.',
    '..XX....XX..'
  ]],
  ship: [[
    '......X......',
    '.....XXX.....',
    '.....XXX.....',
    '.XXXXXXXXXXX.',
    'XXXXXXXXXXXXX',
    'XXXXXXXXXXXXX',
    'XXXXXXXXXXXXX',
    'XXXXXXXXXXXXX'
  ]],
  ufo: [[
    '.....XXXXXX.....',
    '...XXXXXXXXXX...',
    '..XXXXXXXXXXXX..',
    '.XX.XX.XX.XX.XX.',
    'XXXXXXXXXXXXXXXX',
    '..XXX..XX..XXX..',
    '...X........X...'
  ]]
};

/* Cache degli sprite renderizzati (tipo+frame+colore -> canvas) */
const sprCache = new Map();
function sprite(name, frame, color){
  const key = name+frame+color;
  let c = sprCache.get(key);
  if (!c){
    const rows = SPR[name][frame];
    c = document.createElement('canvas');
    c.width = rows[0].length; c.height = rows.length;
    const g = c.getContext('2d');
    g.fillStyle = color;
    for (let y=0; y<rows.length; y++)
      for (let x=0; x<rows[y].length; x++)
        if (rows[y][x] === 'X') g.fillRect(x,y,1,1);
    sprCache.set(key,c);
  }
  return c;
}

/* ============ Audio (tutto sintetizzato) ============ */
let ac = null, master = null, noiseBuf = null;
let muted = localStorage.getItem('li_muted') === '1';

function audioInit(){
  if (ac) return;
  try{
    ac = new (window.AudioContext || window.webkitAudioContext)();
  }catch(e){ return; }
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -18; comp.ratio.value = 8;
  master = ac.createGain();
  master.gain.value = muted ? 0 : 0.5;
  master.connect(comp); comp.connect(ac.destination);
  const len = ac.sampleRate * 1;
  noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i=0; i<len; i++) d[i] = Math.random()*2-1;
}
function audioResume(){
  audioInit();
  if (ac && ac.state === 'suspended') ac.resume();
}
function setMuted(m){
  muted = m;
  localStorage.setItem('li_muted', m ? '1' : '0');
  if (master) master.gain.value = m ? 0 : 0.5;
  btnSound.textContent = m ? 'AUDIO OFF' : 'AUDIO ON';
}

function noise(dur, freq, vol, type){
  if (!ac || muted) return;
  const t = ac.currentTime;
  const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const f = ac.createBiquadFilter(); f.type = type || 'bandpass';
  f.frequency.setValueAtTime(freq, t);
  f.frequency.exponentialRampToValueAtTime(Math.max(60, freq*0.25), t+dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t); s.stop(t+dur+0.02);
}
function tone(type, f0, f1, dur, vol, when){
  if (!ac || muted) return;
  const t = ac.currentTime + (when||0);
  const o = ac.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t+dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t+dur+0.03);
}

/* Il "pew": due oscillatori in caduta esponenziale, il classico laser disco */
function sfxLaser(){
  tone('square',   1900, 150, 0.17, 0.35);
  tone('sawtooth', 2900, 220, 0.15, 0.18);
  noise(0.05, 5000, 0.10, 'highpass');
}
function sfxAlienHit(){
  noise(0.12, 1400, 0.4);
  tone('square', 420, 60, 0.12, 0.3);
}
function sfxBombPop(){
  noise(0.06, 2400, 0.25);
}
function sfxPlayerBoom(){
  noise(0.7, 900, 0.55, 'lowpass');
  tone('sawtooth', 220, 28, 0.7, 0.4);
}
function sfxMarch(step){
  const notes = [110, 104, 98, 92];
  tone('square', notes[step % 4], notes[step % 4], 0.09, 0.22);
  tone('triangle', notes[step % 4] / 2, notes[step % 4] / 2, 0.09, 0.25);
}
function sfxUfoHit(){
  tone('square', 1200, 200, 0.35, 0.3);
  noise(0.3, 2000, 0.3);
}
function sfxWaveClear(){
  [523, 659, 784, 1047].forEach((f,i) => tone('square', f, f, 0.09, 0.25, i*0.09));
}
function sfxGameOver(){
  [392, 330, 262, 196, 131].forEach((f,i) => tone('sawtooth', f, f*0.97, 0.18, 0.3, i*0.16));
}
function sfxExtraLife(){
  [880, 1320].forEach((f,i) => tone('square', f, f, 0.09, 0.3, i*0.1));
}

/* UFO: sirena continua finché è in volo */
let ufoOsc = null, ufoLfo = null, ufoGain = null;
function ufoSoundStart(){
  if (!ac || muted || ufoOsc) return;
  ufoOsc = ac.createOscillator(); ufoOsc.type = 'triangle';
  ufoOsc.frequency.value = 880;
  ufoLfo = ac.createOscillator(); ufoLfo.frequency.value = 5;
  const lg = ac.createGain(); lg.gain.value = 120;
  ufoLfo.connect(lg); lg.connect(ufoOsc.frequency);
  ufoGain = ac.createGain(); ufoGain.gain.value = 0.07;
  ufoOsc.connect(ufoGain); ufoGain.connect(master);
  ufoOsc.start(); ufoLfo.start();
}
function ufoSoundStop(){
  if (ufoOsc){ try{ ufoOsc.stop(); ufoLfo.stop(); }catch(e){} }
  ufoOsc = ufoLfo = ufoGain = null;
}

/* ============ Stato di gioco ============ */
const ST = { BOOT:0, ATTRACT:1, WAVEINTRO:2, PLAY:3, DYING:4, GAMEOVER:5 };
let state = ST.BOOT;
let stateT = 0;            // tempo trascorso nello stato corrente
let paused = false;

let score = 0;
let hiscore = parseInt(localStorage.getItem('li_hiscore') || '0', 10) || 0;
let lives = 3;
let wave = 1;
let extraLifeGiven = false;

const GROUND_Y = 306;
const PLAYER_Y = 286;

/* Player */
const player = { x: W/2, w: 13, h: 8, targetX: null, invuln: 0, cool: 0 };

/* Alieni */
const COLS = 10, ROWS = 5, CELL = 17;
let aliens = [];            // {r,c,type,alive}
let gridX = 0, gridY = 0;   // origine della griglia
let gridDir = 1;
let stepTimer = 0, stepFrame = 0, marchStep = 0;
let aliveCount = 0;

/* Proiettili */
let lasers = [];            // {x,y}
let bombs = [];             // {x,y,ph}
let bombTimer = 0;

/* UFO */
let ufo = null;             // {x,dir}
let ufoTimer = 12;

/* Bunker */
const BK_W = 22, BK_H = 14;
let bunkers = [];           // {x,y,mask,canvas,dirty}

/* Effetti */
let particles = [];         // {x,y,vx,vy,life,color}
let popups = [];            // {x,y,text,life,color}
let shake = 0;
let flash = 0;

/* Stelle di sfondo */
const stars = [];
for (let i=0; i<44; i++)
  stars.push({ x: Math.random()*W, y: Math.random()*H, s: Math.random()<0.3?2:1, v: 2+Math.random()*6, tw: Math.random()*6.28 });

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ============ Costruzione ondata ============ */
function alienType(r){ return r===0 ? 'squid' : (r<3 ? 'crab' : 'octo'); }
function alienPoints(t){ return t==='squid' ? 30 : (t==='crab' ? 20 : 10); }
function alienW(t){ return SPR[t][0][0].length; }

function buildWave(){
  aliens = [];
  for (let r=0; r<ROWS; r++)
    for (let c=0; c<COLS; c++)
      aliens.push({ r, c, type: alienType(r), alive: true });
  aliveCount = ROWS*COLS;
  gridX = (W - COLS*CELL) / 2;
  gridY = 52 + Math.min(4, wave-1) * 9;
  gridDir = 1;
  stepTimer = 0; stepFrame = 0; marchStep = 0;
  lasers = []; bombs = []; bombTimer = 1.2;
  ufo = null; ufoSoundStop(); ufoTimer = 14 + Math.random()*10;
  buildBunkers();
}

function buildBunkers(){
  bunkers = [];
  const n = 4, gap = W/n;
  for (let i=0; i<n; i++){
    const mask = [];
    for (let y=0; y<BK_H; y++){
      const row = [];
      for (let x=0; x<BK_W; x++){
        let on = true;
        const t = y;                                  // arco superiore
        if (t===0 && (x<4 || x>=BK_W-4)) on = false;
        if (t===1 && (x<3 || x>=BK_W-3)) on = false;
        if (t===2 && (x<2 || x>=BK_W-2)) on = false;
        if (t===3 && (x<1 || x>=BK_W-1)) on = false;
        if (y>=BK_H-4){                               // arco inferiore (porta)
          const d = y-(BK_H-4);
          if (x >= 7-d && x <= BK_W-8+d) on = false;
        }
        row.push(on ? 1 : 0);
      }
      mask.push(row);
    }
    const c = document.createElement('canvas');
    c.width = BK_W; c.height = BK_H;
    bunkers.push({ x: gap*i + (gap-BK_W)/2, y: 252, mask, canvas: c, dirty: true });
  }
}
function bunkerRepaint(b){
  const g = b.canvas.getContext('2d');
  g.clearRect(0,0,BK_W,BK_H);
  g.fillStyle = COLORS.green;
  for (let y=0; y<BK_H; y++)
    for (let x=0; x<BK_W; x++)
      if (b.mask[y][x]) g.fillRect(x,y,1,1);
  b.dirty = false;
}
/* Erode il bunker attorno a un punto d'impatto (coordinate locali) */
function bunkerDamage(b, lx, ly){
  for (let i=0; i<14; i++){
    const dx = Math.round((Math.random()-0.5)*5);
    const dy = Math.round((Math.random()-0.5)*5);
    const x = lx+dx, y = ly+dy;
    if (x>=0 && x<BK_W && y>=0 && y<BK_H) b.mask[y][x] = 0;
  }
  for (let dy=-1; dy<=1; dy++)
    for (let dx=-1; dx<=1; dx++){
      const x = lx+dx, y = ly+dy;
      if (x>=0 && x<BK_W && y>=0 && y<BK_H) b.mask[y][x] = 0;
    }
  b.dirty = true;
}
/* Punto (x,y) globale colpisce un bunker? Ritorna il bunker o null */
function bunkerAt(x, y){
  for (const b of bunkers){
    const lx = Math.floor(x-b.x), ly = Math.floor(y-b.y);
    if (lx>=0 && lx<BK_W && ly>=0 && ly<BK_H && b.mask[ly][lx]) return {b, lx, ly};
  }
  return null;
}

/* ============ Gestione stati ============ */
function setState(s){ state = s; stateT = 0; }

function startGame(){
  score = 0; lives = 3; wave = 1; extraLifeGiven = false;
  particles = []; popups = [];
  player.x = W/2; player.invuln = 0; player.cool = 0; player.targetX = null;
  buildWave();
  setState(ST.WAVEINTRO);
}

function addScore(n){
  score += n;
  if (!extraLifeGiven && score >= 1500){
    extraLifeGiven = true;
    lives = Math.min(5, lives+1);
    popups.push({ x: player.x, y: PLAYER_Y-14, text: 'VITA EXTRA', life: 1.4, color: COLORS.amber });
    sfxExtraLife();
  }
  if (score > hiscore){
    hiscore = score;
    localStorage.setItem('li_hiscore', String(hiscore));
  }
}

function boom(x, y, color, n){
  for (let i=0; i<n; i++){
    const a = Math.random()*6.28, v = 20+Math.random()*70;
    particles.push({ x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v, life: 0.3+Math.random()*0.25, color });
  }
}

/* ============ Update ============ */
function alienRect(a){
  const w = alienW(a.type);
  return {
    x: gridX + a.c*CELL + (CELL-w)/2,
    y: gridY + a.r*CELL,
    w, h: 8
  };
}

function update(dt){
  stateT += dt;
  if (shake > 0) shake = Math.max(0, shake-dt*3);
  if (flash > 0) flash = Math.max(0, flash-dt*4);

  if (!reduceMotion)
    for (const s of stars){ s.y += s.v*dt; s.tw += dt*3; if (s.y > H){ s.y = -2; s.x = Math.random()*W; } }

  for (const p of particles){ p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  for (const p of popups){ p.y -= 12*dt; p.life -= dt; }
  popups = popups.filter(p => p.life > 0);

  switch (state){
    case ST.BOOT:
      if (stateT > 1.15) setState(ST.ATTRACT);
      break;

    case ST.ATTRACT:
      break; // si esce con startGame() dall'input

    case ST.WAVEINTRO:
      if (stateT > 1.6) setState(ST.PLAY);
      break;

    case ST.PLAY:
      updatePlay(dt);
      break;

    case ST.DYING:
      updateBombs(dt, false);
      if (stateT > 1.1){
        if (lives <= 0){
          gameOver();
        } else {
          player.x = W/2; player.targetX = null; player.invuln = 2.2;
          setState(ST.PLAY);
        }
      }
      break;

    case ST.GAMEOVER:
      if (stateT > 6) setState(ST.ATTRACT);
      break;
  }
}

function gameOver(){
  ufoSoundStop();
  sfxGameOver();
  setState(ST.GAMEOVER);
}

function playerDie(){
  if (player.invuln > 0) return;
  lives--;
  shake = 1; flash = 0.6;
  boom(player.x, PLAYER_Y+4, COLORS.green, 26);
  boom(player.x, PLAYER_Y+4, COLORS.white, 10);
  sfxPlayerBoom();
  lasers = [];
  setState(ST.DYING);
}

function updatePlay(dt){
  /* --- movimento player --- */
  const kb = (keys.right?1:0) - (keys.left?1:0) + (pad.right?1:0) - (pad.left?1:0);
  if (kb !== 0){
    player.x += kb * 120 * dt;
    player.targetX = null;
  } else if (player.targetX != null){
    const d = player.targetX - player.x;
    const step = Math.sign(d) * Math.min(Math.abs(d), 300*dt);
    player.x += step;
  }
  player.x = Math.max(9, Math.min(W-9, player.x));
  if (player.invuln > 0) player.invuln -= dt;
  if (player.cool > 0) player.cool -= dt;
  if ((keys.fire || pad.fire) && player.cool <= 0) fireLaser();

  /* --- marcia alieni --- */
  const ratio = aliveCount / (ROWS*COLS);
  let interval = (0.08 + 0.62*ratio) * Math.pow(0.93, wave-1);
  interval = Math.max(0.055, interval);
  stepTimer += dt;
  if (stepTimer >= interval){
    stepTimer = 0;
    stepFrame ^= 1;
    marchStep++;
    sfxMarch(marchStep);

    /* limiti orizzontali della griglia (solo colonne vive) */
    let minX = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const a of aliens){
      if (!a.alive) continue;
      const r = alienRect(a);
      minX = Math.min(minX, r.x); maxX = Math.max(maxX, r.x+r.w);
      maxY = Math.max(maxY, r.y+r.h);
    }
    const dx = 3 * gridDir;
    if ((gridDir>0 && maxX+dx > W-6) || (gridDir<0 && minX+dx < 6)){
      gridDir *= -1;
      gridY += 7;
    } else {
      gridX += dx;
    }

    /* alieni che passano sui bunker li erodono */
    for (const a of aliens){
      if (!a.alive) continue;
      const r = alienRect(a);
      for (const b of bunkers){
        if (r.x < b.x+BK_W && r.x+r.w > b.x && r.y < b.y+BK_H && r.y+r.h > b.y){
          for (let y=0; y<BK_H; y++)
            for (let x=0; x<BK_W; x++){
              const gx = b.x+x, gy = b.y+y;
              if (gx>=r.x && gx<r.x+r.w && gy>=r.y && gy<r.y+r.h) b.mask[y][x] = 0;
            }
          b.dirty = true;
        }
      }
    }

    /* invasione: alieni arrivati alla linea del player */
    if (maxY >= PLAYER_Y){
      lives = 0;
      playerDieInvasion();
      return;
    }
  }

  /* --- laser del player --- */
  for (const l of lasers){
    l.y -= 260*dt;
    const hitB = bunkerAt(l.x, l.y);
    if (hitB){ bunkerDamage(hitB.b, hitB.lx, hitB.ly); l.dead = true; continue; }
    if (ufo && l.y < 46 && l.x > ufo.x && l.x < ufo.x+16){
      const pts = [50,100,150,300][Math.floor(Math.random()*4)];
      addScore(pts);
      popups.push({ x: ufo.x+8, y: 40, text: String(pts), life: 1.2, color: COLORS.red });
      boom(ufo.x+8, 42, COLORS.red, 16);
      ufo = null; ufoSoundStop(); sfxUfoHit();
      l.dead = true; continue;
    }
    for (const a of aliens){
      if (!a.alive) continue;
      const r = alienRect(a);
      if (l.x >= r.x && l.x <= r.x+r.w && l.y >= r.y && l.y <= r.y+r.h){
        a.alive = false; aliveCount--;
        addScore(alienPoints(a.type));
        boom(r.x+r.w/2, r.y+4, bandColor(r.y+4), 12);
        sfxAlienHit();
        l.dead = true;
        break;
      }
    }
  }
  lasers = lasers.filter(l => !l.dead && l.y > 30);

  /* --- bombe aliene --- */
  updateBombs(dt, true);

  /* --- UFO --- */
  if (ufo){
    ufo.x += ufo.dir * 34 * dt;
    if (ufo.x < -18 || ufo.x > W+2){ ufo = null; ufoSoundStop(); }
  } else {
    ufoTimer -= dt;
    if (ufoTimer <= 0 && aliveCount > 4){
      const dir = Math.random() < 0.5 ? 1 : -1;
      ufo = { x: dir>0 ? -16 : W, dir };
      ufoTimer = 16 + Math.random()*14;
      ufoSoundStart();
    }
  }

  /* --- ondata completata --- */
  if (aliveCount === 0){
    wave++;
    sfxWaveClear();
    buildWave();
    setState(ST.WAVEINTRO);
  }
}

function playerDieInvasion(){
  player.invuln = 0;
  shake = 1; flash = 0.6;
  boom(player.x, PLAYER_Y+4, COLORS.green, 26);
  sfxPlayerBoom();
  ufoSoundStop();
  setState(ST.DYING);
}

function updateBombs(dt, canSpawn){
  if (canSpawn){
    bombTimer -= dt;
    const maxBombs = Math.min(3 + Math.floor(wave/2), 7);
    if (bombTimer <= 0 && bombs.length < maxBombs && aliveCount > 0){
      bombTimer = Math.max(0.25, (0.9 - wave*0.06)) + Math.random()*0.7;
      /* scegli l'alieno più in basso di una colonna casuale viva */
      const cols = [];
      for (let c=0; c<COLS; c++){
        let low = null;
        for (const a of aliens) if (a.alive && a.c === c && (!low || a.r > low.r)) low = a;
        if (low) cols.push(low);
      }
      if (cols.length){
        const a = cols[Math.floor(Math.random()*cols.length)];
        const r = alienRect(a);
        bombs.push({ x: r.x+r.w/2, y: r.y+9, ph: 0 });
      }
    }
  }
  const spd = 52 + Math.min(60, wave*7);
  for (const b of bombs){
    b.y += spd*dt; b.ph += dt*14;
    const hitB = bunkerAt(b.x, b.y+3);
    if (hitB){ bunkerDamage(hitB.b, hitB.lx, hitB.ly); b.dead = true; continue; }
    /* le bombe possono essere distrutte dal laser */
    for (const l of lasers){
      if (!l.dead && Math.abs(l.x-b.x) < 3 && Math.abs(l.y-b.y) < 5){
        b.dead = true; l.dead = true;
        boom(b.x, b.y, COLORS.white, 6);
        sfxBombPop();
      }
    }
    if (b.dead) continue;
    if (state === ST.PLAY && player.invuln <= 0 &&
        b.y+3 >= PLAYER_Y && b.y <= PLAYER_Y+8 &&
        Math.abs(b.x - player.x) < 7){
      b.dead = true;
      playerDie();
      break;
    }
    if (b.y > GROUND_Y-2){
      b.dead = true;
      boom(b.x, GROUND_Y-2, COLORS.dim, 4);
    }
  }
  bombs = bombs.filter(b => !b.dead);
}

function fireLaser(){
  if (state !== ST.PLAY) return;
  if (lasers.length >= 2) return;
  player.cool = 0.30;
  lasers.push({ x: player.x, y: PLAYER_Y-2 });
  sfxLaser();
}

/* ============ Rendering ============ */
function text(str, x, y, color, size, align){
  cx.font = (size||8) + 'px "Press Start 2P"';
  cx.textAlign = align || 'left';
  cx.textBaseline = 'top';
  cx.fillStyle = color;
  cx.fillText(str, Math.round(x), Math.round(y));
}
function pad6(n){ return String(n).padStart(6,'0'); }

function draw(){
  cx.setTransform(1,0,0,1,0,0);
  cx.clearRect(0,0,W,H);
  cx.fillStyle = '#000';
  cx.fillRect(0,0,W,H);

  if (state === ST.BOOT){ drawBoot(); return; }

  if (shake > 0 && !reduceMotion){
    cx.translate(Math.round((Math.random()-0.5)*shake*5), Math.round((Math.random()-0.5)*shake*4));
  }

  /* stelle */
  for (const s of stars){
    const a = 0.25 + 0.2*Math.sin(s.tw);
    cx.globalAlpha = a;
    cx.fillStyle = s.s === 2 ? COLORS.cyan : COLORS.white;
    cx.fillRect(Math.round(s.x), Math.round(s.y), 1, s.s === 2 ? 2 : 1);
  }
  cx.globalAlpha = 1;

  if (state === ST.ATTRACT){ drawAttract(); drawFlash(); return; }

  /* --- HUD --- */
  text('PUNTEGGIO', 8, 6, COLORS.dim, 8);
  text(pad6(score), 8, 17, COLORS.amber, 8);
  text('RECORD', W-8, 6, COLORS.dim, 8, 'right');
  text(pad6(hiscore), W-8, 17, COLORS.amber, 8, 'right');

  /* terreno */
  cx.fillStyle = COLORS.green;
  cx.fillRect(0, GROUND_Y, W, 1);

  /* vite + ondata */
  const shipIcon = sprite('ship', 0, COLORS.green);
  for (let i=0; i<Math.max(0, lives-1); i++)
    cx.drawImage(shipIcon, 8 + i*17, GROUND_Y+5);
  text('ONDATA '+wave, W-8, GROUND_Y+6, COLORS.dim, 8, 'right');

  /* bunker */
  for (const b of bunkers){
    if (b.dirty) bunkerRepaint(b);
    cx.drawImage(b.canvas, Math.round(b.x), b.y);
  }

  /* alieni */
  for (const a of aliens){
    if (!a.alive) continue;
    const r = alienRect(a);
    cx.drawImage(sprite(a.type, stepFrame, bandColor(r.y+4)), Math.round(r.x), Math.round(r.y));
  }

  /* UFO */
  if (ufo) cx.drawImage(sprite('ufo', 0, COLORS.red), Math.round(ufo.x), 38);

  /* player */
  const showShip = state !== ST.DYING &&
    !(player.invuln > 0 && Math.floor(player.invuln*10) % 2 === 0);
  if (showShip && (state === ST.PLAY || state === ST.WAVEINTRO)){
    cx.drawImage(sprite('ship', 0, COLORS.green), Math.round(player.x-6), PLAYER_Y);
  }

  /* laser */
  cx.fillStyle = COLORS.white;
  for (const l of lasers){
    cx.fillRect(Math.round(l.x), Math.round(l.y), 1, 5);
    cx.fillStyle = COLORS.cyan;
    cx.fillRect(Math.round(l.x), Math.round(l.y)+5, 1, 2);
    cx.fillStyle = COLORS.white;
  }

  /* bombe (zigzag) */
  for (const b of bombs){
    const c = bandColor(b.y);
    cx.fillStyle = c;
    const o = Math.floor(b.ph) % 2 === 0 ? 1 : -1;
    cx.fillRect(Math.round(b.x)-o, Math.round(b.y), 1, 2);
    cx.fillRect(Math.round(b.x), Math.round(b.y)+2, 1, 2);
    cx.fillRect(Math.round(b.x)+o, Math.round(b.y)+4, 1, 2);
  }

  /* particelle */
  for (const p of particles){
    cx.globalAlpha = Math.min(1, p.life*3);
    cx.fillStyle = p.color;
    cx.fillRect(Math.round(p.x), Math.round(p.y), 2, 2);
  }
  cx.globalAlpha = 1;

  /* popup punti */
  for (const p of popups){
    cx.globalAlpha = Math.min(1, p.life*2);
    text(p.text, p.x, p.y, p.color, 8, 'center');
  }
  cx.globalAlpha = 1;

  /* overlay di stato */
  if (state === ST.WAVEINTRO){
    text('ONDATA '+wave, W/2, 140, COLORS.cyan, 8, 'center');
    if (wave === 1 && stateT < 1.2)
      text('DIFENDI LA GALASSIA', W/2, 158, COLORS.dim, 8, 'center');
  }
  if (state === ST.GAMEOVER) drawGameOver();
  if (paused){
    cx.fillStyle = 'rgba(0,0,0,0.6)';
    cx.fillRect(0,0,W,H);
    if (Math.floor(performance.now()/400) % 2 === 0)
      text('PAUSA', W/2, 150, COLORS.amber, 8, 'center');
  }

  drawFlash();
}

function drawFlash(){
  if (flash > 0){
    cx.globalAlpha = flash*0.5;
    cx.fillStyle = '#fff';
    cx.fillRect(0,0,W,H);
    cx.globalAlpha = 1;
  }
}

/* Accensione CRT: linea orizzontale che sboccia a pieno schermo */
function drawBoot(){
  const t = stateT;
  cx.fillStyle = '#000'; cx.fillRect(0,0,W,H);
  if (t < 0.4){
    const w = (t/0.4) * W;
    cx.fillStyle = COLORS.white;
    cx.globalAlpha = 0.9;
    cx.fillRect((W-w)/2, H/2-1, w, 2);
    cx.globalAlpha = 1;
  } else if (t < 0.9){
    const k = (t-0.4)/0.5;
    const h = 2 + k*k*H;
    cx.fillStyle = COLORS.white;
    cx.globalAlpha = 0.85 - k*0.55;
    cx.fillRect(0, (H-h)/2, W, h);
    cx.globalAlpha = 1;
  } else {
    cx.fillStyle = '#fff';
    cx.globalAlpha = Math.max(0, 1-(t-0.9)/0.25) * 0.3;
    cx.fillRect(0,0,W,H);
    cx.globalAlpha = 1;
  }
}

function drawAttract(){
  const t = stateT;

  /* titolo con "aberrazione cromatica" */
  cx.save();
  text('LASER', W/2+2, 62+2, COLORS.magenta, 16, 'center');
  text('LASER', W/2, 62, COLORS.cyan, 16, 'center');
  text('INVADERS', W/2+2, 86+2, COLORS.magenta, 16, 'center');
  text('INVADERS', W/2, 86, COLORS.cyan, 16, 'center');
  cx.restore();
  text('GALASSIA 1982', W/2, 112, COLORS.dim, 8, 'center');

  /* tabella punti con sprite animati */
  const fr = Math.floor(t*2) % 2;
  const rows = [
    ['ufo',   COLORS.red,   '? MISTERO', 150],
    ['squid', COLORS.magenta,'30 PUNTI', 172],
    ['crab',  COLORS.cyan,  '20 PUNTI', 194],
    ['octo',  COLORS.green, '10 PUNTI', 216]
  ];
  for (const [name, col, label, y] of rows){
    const sp = sprite(name, name==='ufo'?0:fr, col);
    cx.drawImage(sp, Math.round(W/2 - 46 - sp.width/2), y-1);
    text('= '+label, W/2-30, y, col, 8);
  }

  /* invito lampeggiante */
  if (Math.floor(t*2) % 2 === 0){
    text(isTouch ? 'TOCCA PER GIOCARE' : 'PREMI START', W/2, 252, COLORS.white, 8, 'center');
  }
  text('RECORD '+pad6(hiscore), W/2, 276, COLORS.amber, 8, 'center');
  text('(C) 1982 BACCHIN CORP.', W/2, 300, COLORS.dim, 8, 'center');
}

function drawGameOver(){
  cx.fillStyle = 'rgba(0,0,0,0.55)';
  cx.fillRect(0, 118, W, 84);
  /* scritta che si "digita" lettera per lettera */
  const msg = 'FINE PARTITA';
  const n = Math.min(msg.length, Math.floor(stateT/0.12));
  text(msg.slice(0,n), W/2, 132, COLORS.red, 12, 'center');
  if (stateT > msg.length*0.12 + 0.3){
    text('PUNTEGGIO '+pad6(score), W/2, 158, COLORS.white, 8, 'center');
    if (score >= hiscore && score > 0 && Math.floor(stateT*3)%2===0)
      text('NUOVO RECORD!', W/2, 176, COLORS.amber, 8, 'center');
  }
}

/* ============ Input ============ */
const keys = { left:false, right:false, fire:false };
const pad  = { left:false, right:false, fire:false };
const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;

function anyStart(){
  audioResume();
  if (paused){ togglePause(false); return; }
  if (state === ST.ATTRACT) startGame();
  else if (state === ST.GAMEOVER && stateT > 1.5) setState(ST.ATTRACT);
}

addEventListener('keydown', e => {
  if (e.repeat) return;
  audioResume();
  switch (e.code){
    case 'ArrowLeft': case 'KeyA': keys.left = true; e.preventDefault(); break;
    case 'ArrowRight': case 'KeyD': keys.right = true; e.preventDefault(); break;
    case 'Space':
      e.preventDefault();
      if (state === ST.ATTRACT || state === ST.GAMEOVER) anyStart();
      else { keys.fire = true; fireOnPress(); }
      break;
    case 'Enter': anyStart(); break;
    case 'KeyP': togglePause(); break;
    case 'KeyM': setMuted(!muted); break;
  }
});
addEventListener('keyup', e => {
  switch (e.code){
    case 'ArrowLeft': case 'KeyA': keys.left = false; break;
    case 'ArrowRight': case 'KeyD': keys.right = false; break;
    case 'Space': keys.fire = false; break;
  }
});
function fireOnPress(){
  if (state === ST.PLAY && !paused && player.cool <= 0) fireLaser();
}

/* Touch: trascina sul canvas per muovere, pulsanti per muovere/sparare */
const screenEl = document.getElementById('screen');
function canvasX(e){
  const r = cv.getBoundingClientRect();
  return (e.clientX - r.left) / r.width * W;
}
screenEl.addEventListener('pointerdown', e => {
  audioResume();
  if (state === ST.ATTRACT || state === ST.GAMEOVER){ anyStart(); return; }
  if (paused){ togglePause(false); return; }
  if (e.pointerType !== 'mouse') player.targetX = canvasX(e);
});
screenEl.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse' && e.buttons !== 0 && state === ST.PLAY)
    player.targetX = canvasX(e);
});

function holdButton(el, prop){
  const ids = new Set();
  const on = e => {
    e.preventDefault();
    audioResume();
    ids.add(e.pointerId);
    pad[prop] = true;
    el.classList.add('held');
    if (prop === 'fire'){
      if (state === ST.ATTRACT || state === ST.GAMEOVER) anyStart();
      else fireOnPress();
    }
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
  };
  const off = e => {
    ids.delete(e.pointerId);
    if (ids.size === 0){ pad[prop] = false; el.classList.remove('held'); }
  };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('lostpointercapture', off);
}
holdButton(document.getElementById('btnLeft'), 'left');
holdButton(document.getElementById('btnRight'), 'right');
holdButton(document.getElementById('btnFire'), 'fire');

const btnSound = document.getElementById('btnSound');
const btnPause = document.getElementById('btnPause');
btnSound.textContent = muted ? 'AUDIO OFF' : 'AUDIO ON';
btnSound.addEventListener('click', () => { audioResume(); setMuted(!muted); });
btnPause.addEventListener('click', () => togglePause());

function togglePause(force){
  if (state !== ST.PLAY && state !== ST.WAVEINTRO && state !== ST.DYING) return;
  paused = force != null ? force : !paused;
  btnPause.textContent = paused ? 'RIPRENDI' : 'PAUSA';
  if (ac){
    if (paused) ac.suspend();
    else if (!muted || true) ac.resume();
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === ST.PLAY) togglePause(true);
});

/* blocca lo scroll-rimbalzo su iOS */
document.addEventListener('touchmove', e => e.preventDefault(), { passive:false });

/* ============ Ridimensionamento ============ */
const stage = document.getElementById('stage');
function resize(){
  const sw = stage.clientWidth, sh = stage.clientHeight;
  const scale = Math.min(sw/(W+20), sh/(H+20));
  const w = Math.floor(W*scale), h = Math.floor(H*scale);
  screenEl.style.width = w+'px';
  screenEl.style.height = h+'px';
}
new ResizeObserver(resize).observe(stage);
addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();

/* ============ Loop principale ============ */
let lastT = performance.now();
let fontReady = false;
if (document.fonts && document.fonts.ready)
  document.fonts.ready.then(() => { fontReady = true; });
try{
  if (document.fonts) document.fonts.load('8px "Press Start 2P"');
}catch(e){ fontReady = true; }

function frame(now){
  const dt = Math.min(0.05, (now-lastT)/1000);
  lastT = now;
  if (!paused) update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ============ Service worker (offline / PWA) ============ */
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
