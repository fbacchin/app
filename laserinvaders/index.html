  background:radial-gradient(120% 90% at 50% 30%,var(--room) 0%,#020308 100%);
  color:var(--green);
  font-family:var(--px);
  overflow:hidden;
  touch-action:none;
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;
}

/* ============ Layout cabinet ============ */
#cabinet{
  height:100%;
  display:flex;flex-direction:column;align-items:center;
  padding:calc(6px + env(safe-area-inset-top)) calc(6px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) calc(6px + env(safe-area-inset-left));
  gap:8px;
}
#marquee{
  flex:none;
  font-size:13px;letter-spacing:2px;text-align:center;padding-top:6px;
  color:var(--cyan);
  text-shadow:0 0 8px rgba(46,230,255,.9),3px 3px 0 var(--magenta),3px 3px 8px rgba(255,61,240,.7);
}
#marquee small{display:block;font-size:7px;color:#5a637f;text-shadow:none;margin-top:6px;letter-spacing:3px}
#stage{flex:1;align-self:stretch;position:relative;min-height:0}

/* ============ Schermo CRT ============ */
#screen{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  background:#000;
  border:8px solid var(--bezel);
  outline:2px solid var(--bezel-edge);
  border-radius:14px;
  box-shadow:0 0 70px rgba(46,230,255,.10),0 0 24px rgba(0,0,0,.9),inset 0 0 40px rgba(0,0,0,.7);
  overflow:hidden;
}
#game{
  display:block;width:100%;height:100%;
  image-rendering:pixelated;image-rendering:crisp-edges;
  background:#000;
}
#screen .fx{position:absolute;inset:0;pointer-events:none;border-radius:6px}
#screen .scanlines{
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);
  mix-blend-mode:multiply;
}
#screen .rgbmask{
  background:repeating-linear-gradient(to right,rgba(255,0,90,.06) 0 1px,rgba(0,255,140,.05) 1px 2px,rgba(0,120,255,.06) 2px 3px);
}
#screen .vignette{
  background:radial-gradient(ellipse 90% 80% at 50% 48%,transparent 55%,rgba(0,0,0,.5) 100%);
}
#screen .flicker{background:#fff;opacity:0;animation:flick 7s infinite steps(1)}
@keyframes flick{
  0%,93%,100%{opacity:0}
  94%{opacity:.015}95%{opacity:0}
  96.5%{opacity:.02}97%{opacity:0}
}

/* ============ Pulsanti servizio (audio / pausa) ============ */
#sysbtns{position:absolute;top:2px;right:2px;display:flex;gap:6px;z-index:5;flex-wrap:wrap;justify-content:flex-end;max-width:100%}
.sysbtn{
  font-family:var(--px);font-size:8px;letter-spacing:1px;
  color:#7f8ab0;background:rgba(8,10,20,.75);
  border:1px solid #2a3350;border-radius:6px;
  padding:8px 9px;cursor:pointer;
}
.sysbtn:active{color:var(--cyan);border-color:var(--cyan)}
.sysbtn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* ============ Controlli touch ============ */
#controls{
  flex:none;align-self:stretch;
  display:none;
  justify-content:space-between;align-items:center;
  padding:2px 10px 6px;
  gap:12px;
}
#dragHint{
  font-size:7px;letter-spacing:1px;line-height:2.1;color:#4a5470;
  padding-left:8px;
}
.padbtn{
  border-radius:50%;
  border:2px solid #432a50;
  background:rgba(10,13,26,.85);
  font-family:var(--px);
  display:flex;align-items:center;justify-content:center;
  touch-action:none;
}
.padbtn.fire{
  width:96px;height:96px;
  color:var(--magenta);font-size:11px;letter-spacing:1px;
  box-shadow:0 0 16px rgba(255,61,240,.18),inset 0 0 12px rgba(0,0,0,.6);
}
.padbtn.fire.held{border-color:var(--magenta);color:#fff;background:rgba(255,61,240,.16)}
@media (pointer:coarse){
  #controls{display:flex}
  #marquee{display:none}
}

/* ============ Suggerimenti desktop ============ */
#hint{
  flex:none;font-size:7px;letter-spacing:2px;color:#4a5470;padding-bottom:4px;text-align:center;
}
@media (pointer:coarse){#hint{display:none}}
@media (max-height:520px){#marquee{display:none}}

@media (prefers-reduced-motion:reduce){
  #screen .flicker{animation:none}
}

<body>
<div id="cabinet">
  <div id="marquee">LASER INVADERS<small>GALASSIA · 1982</small></div>
  <div id="stage">
    <div id="screen">
      <canvas id="game" width="256" height="320"></canvas>
      <div class="fx rgbmask"></div>
      <div class="fx scanlines"></div>
      <div class="fx vignette"></div>
      <div class="fx flicker"></div>
    </div>
    <div id="sysbtns">
      <button class="sysbtn" id="btnLaserSfx" aria-label="Cambia il suono del laser">SYNTH SWEEP</button>
      <button class="sysbtn" id="btnSound" aria-label="Attiva o disattiva audio">AUDIO ON</button>
      <button class="sysbtn" id="btnPause" aria-label="Pausa">PAUSA</button>
    </div>
  </div>
  <div id="controls">
    <div id="dragHint">TRASCINA SULLO<br>SCHERMO PER MUOVERE</div>
    <div class="padbtn fire" id="btnFire" role="button" aria-label="Fuoco">FUOCO</div>
  </div>
  <div id="hint">&#9664; &#9654; &#9650; &#9660; MUOVI &nbsp;·&nbsp; SPAZIO SPARA (TIENI PREMUTO) &nbsp;·&nbsp; P PAUSA &nbsp;·&nbsp; M AUDIO &nbsp;·&nbsp; L SUONO LASER</div>
</div>

<script>
'use strict';
/* =====================================================================
   LASER INVADERS — sparatutto arcade stile 1982
   Squadriglie di astronavi in picchiata (1/2/3 alla volta), fuoco
   automatico e laser potenziabile: singolo -> doppio -> triplo.
   Risoluzione logica 256x320, upscaling pixelated, audio Web Audio API.
   ===================================================================== */

const W = 256, H = 320;
const cv = document.getElementById('game');
const cx = cv.getContext('2d');

const COLORS = {
  green:'#39ff6e', cyan:'#2ee6ff', magenta:'#ff3df0',
  amber:'#ffb300', red:'#ff2b4a', white:'#e8f6ff', dim:'#43507a'
};

/* ============ Sprite (bitmap in stringhe) ============ */
const SPR = {
  /* caccia veloce — picchiata con serpentina */
  dart: [[
    '...X.X...',
    'X...X...X',
    'XX..X..XX',
    '.XX.X.XX.',
    '..XXXXX..',
    '...XXX...',
    '...XXX...',
    '....X....'
  ],[
    '...X.X...',
    'X...X...X',
    'XX..X..XX',
    '.XX.X.XX.',
    '..XXXXX..',
    '...XXX...',
    '..X.X.X..',
    '....X....'
  ]],
  /* incrociatore ad ali larghe — attraversa lo schermo */
  wing: [[
    'X.....X.....X',
    'XX....X....XX',
    'XXX..XXX..XXX',
    'XXXXXXXXXXXXX',
    '.XXXXXXXXXXX.',
    '..XX.XXX.XX..',
    '...X..X..X...',
    '......X......'
  ],[
    'X.....X.....X',
    'XX....X....XX',
    'XXX..XXX..XXX',
    'XXXXXXXXXXXXX',
    '.XXXXXXXXXXX.',
    '..XX.XXX.XX..',
    '..X...X...X..',
    '......X......'
  ]],
  /* nave pesante — lenta, a zig-zag, incassa piu colpi */
  heavy: [[
    '.....XXXX.....',
    '...XXXXXXXX...',
    '..XXXXXXXXXX..',
    '.XXX.XXXX.XXX.',
    'XXXXXXXXXXXXXX',
    '.X.XXXXXXXX.X.',
    '.X..XX..XX..X.',
    '....X....X....'
  ],[
    '.....XXXX.....',
    '...XXXXXXXX...',
    '..XXXXXXXXXX..',
    '.XXX.XXXX.XXX.',
    'XXXXXXXXXXXXXX',
    '.X.XXXXXXXX.X.',
    '.X.XX....XX.X.',
    '....X....X....'
  ]],
  /* navicella del giocatore: 3 livelli di armamento */
  ship1: [[
    '......X......',
    '.....XXX.....',
    '.....XXX.....',
    '.XXXXXXXXXXX.',
    'XXXXXXXXXXXXX',
    'XXXXXXXXXXXXX',
    'XXXXXXXXXXXXX',
    'XXXXXXXXXXXXX'
  ]],
  ship2: [[
    'X.....X.....X',
    'X....XXX....X',
    'X....XXX....X',
    'XXXXXXXXXXXXX',
    'XXXXXXXXXXXXX',
    'XXXXXXXXXXXXX',
    'XXXXXXXXXXXXX',
    'XXXXXXXXXXXXX'
  ]],
  ship3: [[
    'X..X..X..X..X',
    'X..X.XXX.X..X',
    'X..X.XXX.X..X',
    'XXXXXXXXXXXXX',
    'XXXXXXXXXXXXX',
    'XXXXXXXXXXXXX',
    'XXXXXXXXXXXXX',
    'XXXXXXXXXXXXX'
  ]],
  /* drone gregario */
  drone: [[
    '..XXX..',
    '.XXXXX.',
    'XX.X.XX',
    '.XXXXX.',
    '..X.X..'
  ],[
    '..XXX..',
    '.XXXXX.',
    'XX.X.XX',
    '.XXXXX.',
    '.X...X.'
  ]]
};

const ENEMY_DEF = {
  dart:  { color: '#2ee6ff', hp: 1, pts: 50  },
  wing:  { color: '#ff3df0', hp: 2, pts: 100 },
  heavy: { color: '#ffb300', hp: 3, pts: 150 }
};

/* Cache degli sprite renderizzati (tipo+frame+colore -> canvas) */
const sprCache = new Map();
function sprite(name, frame, color){
  const key = name+frame+color;
  let c = sprCache.get(key);
  if (!c){
    const rows = SPR[name][frame];
    c = document.createElement('canvas');
    c.width = rows[0].length; c.height = rows.length;
    const g = c.getContext('2d');
    g.fillStyle = color;
    for (let y=0; y<rows.length; y++)
      for (let x=0; x<rows[y].length; x++)
        if (rows[y][x] === 'X') g.fillRect(x,y,1,1);
    sprCache.set(key,c);
  }
  return c;
}

/* ============ Storage sicuro (Safari in navigazione privata) ============ */
function storeGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function storeSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

/* ============ Audio (tutto sintetizzato) ============ */
let ac = null, master = null, noiseBuf = null;
let muted = storeGet('li_muted') === '1';

function audioInit(){
  if (ac) return;
  try{
    ac = new (window.AudioContext || window.webkitAudioContext)();
  }catch(e){ return; }
  /* su iPhone l'audio deve suonare anche con l'interruttore laterale su silenzioso */
  try{ if (navigator.audioSession) navigator.audioSession.type = 'playback'; }catch(e){}
  /* iOS mette il contesto in pausa per chiamate/Siri: riprendilo appena possibile */
  ac.onstatechange = () => {
    if (ac.state === 'suspended' && !paused && !document.hidden) ac.resume();
  };
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -18; comp.ratio.value = 8;
  master = ac.createGain();
  master.gain.value = muted ? 0 : 0.5;
  master.connect(comp); comp.connect(ac.destination);
  const len = ac.sampleRate * 1;
  noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i=0; i<len; i++) d[i] = Math.random()*2-1;
}
function audioResume(){
  audioInit();
  if (ac && ac.state !== 'running') ac.resume();
}
function setMuted(m){
  muted = m;
  storeSet('li_muted', m ? '1' : '0');
  if (master) master.gain.value = m ? 0 : 0.5;
  btnSound.textContent = m ? 'AUDIO OFF' : 'AUDIO ON';
}

function noise(dur, freq, vol, type){
  if (!ac || muted || ac.state !== 'running') return;
  const t = ac.currentTime;
  const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const f = ac.createBiquadFilter(); f.type = type || 'bandpass';
  f.frequency.setValueAtTime(freq, t);
  f.frequency.exponentialRampToValueAtTime(Math.max(60, freq*0.25), t+dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t); s.stop(t+dur+0.02);
}
function tone(type, f0, f1, dur, vol, when){
  if (!ac || muted || ac.state !== 'running') return;
  const t = ac.currentTime + (when||0);
  const o = ac.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t+dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t+dur+0.03);
}

/* Quattro timbri per il laser, selezionabili in gioco (pulsante o tasto L).
   In tutti: piu raggi = piu acuto, potenziamenti oltre il triplo = piu grave. */
const LASER_SFX = ['RETRO ZAP', 'SYNTH SWEEP', 'UI CLICK', '8BIT SHOOT'];
let laserSfx = (() => {
  const v = parseInt(storeGet('li_lasersfx') ?? '1', 10);
  return (v >= 0 && v < LASER_SFX.length) ? v : 1;
})();

function sfxLaser(count, extra){
  switch (laserSfx){
    case 0: { /* retro laser zap: quadra in caduta rapida, graffiante */
      const base = 1800 + count*220 - extra*120;
      tone('square',   base,     140, 0.15, 0.30);
      tone('sawtooth', base*1.5, 200, 0.12, 0.15);
      noise(0.05, 5000, 0.10, 'highpass');
      break;
    }
    case 1: { /* synth sweep: il "fiu" morbido, glissando sinusoidale */
      const base = Math.max(1500, 2400 + count*250 - extra*180);
      tone('sine',     base,       210, 0.28, 0.42);
      tone('sine',     base*1.011, 225, 0.28, 0.20);
      tone('triangle', base/2,     105, 0.24, Math.min(0.3, 0.14 + extra*0.05));
      break;
    }
    case 2: { /* sci-fi ui click: tick brevissimo e high-tech */
      const base = 2600 + count*180 - extra*100;
      tone('sine',   base,   base*0.55, 0.05, 0.35);
      tone('square', base*2, base*1.2,  0.03, 0.12);
      noise(0.025, 6500, 0.15, 'highpass');
      break;
    }
    case 3: { /* 8bit shoot: chip anni '80, discesa a gradini */
      const base = 1300 + count*150 - extra*80;
      tone('square', base,      base,      0.045, 0.30);
      tone('square', base*0.72, base*0.72, 0.045, 0.30, 0.045);
      tone('square', base*0.5,  base*0.5,  0.05,  0.28, 0.09);
      break;
    }
  }
}
function sfxHitTick(){
  noise(0.05, 2600, 0.18);
}
function sfxEnemyBoom(big){
  noise(big ? 0.28 : 0.14, 1300, 0.42);
  tone('square', 380, 55, big ? 0.26 : 0.13, 0.3);
  if (big) tone('sawtooth', 140, 40, 0.3, 0.25);
}
function sfxPlayerBoom(){
  noise(0.7, 900, 0.55, 'lowpass');
  tone('sawtooth', 220, 28, 0.7, 0.4);
}
function sfxPowerup(){
  [392, 523, 659, 880].forEach((f,i) => tone('square', f, f, 0.08, 0.25, i*0.07));
}
function sfxLevelUp(){
  [660, 880, 1100].forEach((f,i) => tone('square', f, f, 0.09, 0.22, i*0.08));
}
function sfxExtraLife(){
  [880, 1320].forEach((f,i) => tone('square', f, f, 0.09, 0.3, i*0.1));
}
function sfxGameOver(){
  [392, 330, 262, 196, 131].forEach((f,i) => tone('sawtooth', f, f*0.97, 0.18, 0.3, i*0.16));
}
/* battito di fondo che accompagna il gioco */
function sfxPulse(alt){
  tone('triangle', alt ? 82 : 74, 0, 0.07, 0.13);
}

/* ============ Stato di gioco ============ */
const ST = { BOOT:0, ATTRACT:1, INTRO:2, PLAY:3, DYING:4, GAMEOVER:5 };
let state = ST.BOOT;
let stateT = 0;            // tempo trascorso nello stato corrente
let paused = false;

let score = 0;
let hiscore = parseInt(storeGet('li_hiscore') || '0', 10) || 0;
let hiscoreAtStart = 0;
let lives = 3;
let level = 1;
let kills = 0;
let killsSincePow = 0;
let nextLifeAt = 2500;

const GROUND_Y = 306;
const PLAYER_Y = 286;

/* Player */
const player = { x: W/2, y: PLAYER_Y, invuln: 0, cool: 0 };
const PLAYER_MIN_Y = 130;                 // quanto in alto puo salire la navicella
const PLAYER_MAX_Y = GROUND_Y - 12;

/* Scala dei potenziamenti, sempre in salita: prima piu raggi, poi i droni
   gregari che sparano insieme a te, poi la cadenza di fuoco.
   0=singolo, 1=doppio, 2=triplo, 3=+drone, 4=+secondo drone, 5+=raffica */
let powerLevel = 0;
const POWER_MAX = 10;                     // oltre: le capsule valgono punti
function laserCount(){ return Math.min(3, powerLevel + 1); }
function droneCount(){ return Math.max(0, Math.min(2, powerLevel - 2)); }
function speedTier(){ return Math.max(0, powerLevel - 4); }
function fireCooldown(){ return Math.max(0.08, 0.16 * Math.pow(0.87, speedTier())); }

/* Droni gregari: due gusci che inseguono la navicella con un po' di elastico */
const drones = [ { x: W/2, y: PLAYER_Y }, { x: W/2, y: PLAYER_Y } ];
function resetDrones(){ for (const d of drones){ d.x = player.x; d.y = player.y; } }

/* Entita */
let enemies = [];          // navi nemiche in volo
let lasers = [];           // colpi del giocatore {x,y,vx}
let bullets = [];          // colpi nemici {x,y,v}
let powerups = [];         // capsule [P] {x,y,t}
let spawnT = 1.0;
let pulseT = 0, pulseAlt = false;
let animT = 0;

/* Effetti */
let particles = [];        // {x,y,vx,vy,life,color}
let popups = [];           // {x,y,text,life,color}
let shake = 0;
let flash = 0;

/* Stelle di sfondo */
const stars = [];
for (let i=0; i<44; i++)
  stars.push({ x: Math.random()*W, y: Math.random()*H, s: Math.random()<0.3?2:1, v: 2+Math.random()*6, tw: Math.random()*6.28 });

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ============ Nemici: squadriglie di 1/2/3 navi ============ */
function enemySize(type){
  const rows = SPR[type][0];
  return { w: rows[0].length, h: rows.length };
}

/* Posizione secondo lo schema di volo (funzioni pure del tempo di vita) */
function enemyPos(e){
  const t = e.t;
  if (e.pat === 'dive'){
    return { x: e.x0 + e.amp*Math.sin(e.w*t + e.phase), y: e.y0 + e.v*t };
  }
  if (e.pat === 'swoop'){
    return { x: e.x0 + e.dir*e.v*t, y: e.y0 + 14*t + e.amp*Math.sin(e.w*t + e.phase) };
  }
  /* zigzag: onda triangolare, discesa lenta */
  const tri = (2/Math.PI)*Math.asin(Math.sin(e.w*t + e.phase));
  return { x: e.x0 + e.amp*tri, y: e.y0 + e.v*t };
}

function spawnGroup(){
  /* dimensione del gruppo: 1, 2 o 3 — piu grande ai livelli alti */
  const r = Math.random();
  let n;
  if (level <= 1)       n = r < 0.6 ? 1 : 2;
  else if (level === 2) n = r < 0.35 ? 1 : (r < 0.8 ? 2 : 3);
  else                  n = r < 0.22 ? 1 : (r < 0.62 ? 2 : 3);

  /* tipo: dart comune, heavy raro all'inizio */
  const tr = Math.random();
  let type;
  if (level <= 1)       type = tr < 0.7 ? 'dart' : 'wing';
  else if (level === 2) type = tr < 0.5 ? 'dart' : (tr < 0.85 ? 'wing' : 'heavy');
  else                  type = tr < 0.4 ? 'dart' : (tr < 0.75 ? 'wing' : 'heavy');
  if (type === 'heavy' && n > 2) n = 2;

  const spdMul = 1 + Math.min(0.7, (level-1)*0.09);
  const def = ENEMY_DEF[type];

  for (let i=0; i<n; i++){
    const e = {
      type, pat: 'dive', t: 0, hp: def.hp, flash: 0,
      x0: 0, y0: 0, v: 30, amp: 26, w: 2.2, phase: Math.random()*6.28, dir: 1,
      fireT: 1.6 + Math.random()*2.6,
      x: 0, y: -20
    };
    if (type === 'dart'){
      e.pat = 'dive';
      const cx0 = 40 + Math.random()*(W-80);
      e.x0 = Math.min(W-34, Math.max(34, cx0 + (i-(n-1)/2)*26));
      e.y0 = -12 - i*16 - (i%2)*6;              // formazione a V
      e.v = (34 + Math.random()*10) * spdMul;
      e.amp = 20 + Math.random()*14;
      e.w = 2.0 + Math.random()*0.8;
    } else if (type === 'wing'){
      e.pat = 'swoop';
      e.dir = Math.random() < 0.5 ? 1 : -1;
      e.x0 = e.dir > 0 ? -16 - i*24 : W + 16 + i*24;
      e.y0 = 34 + Math.random()*46;
      e.v = (36 + Math.random()*10) * spdMul;
      e.amp = 14 + Math.random()*10;
      e.w = 2.6;
    } else {
      e.pat = 'zigzag';
      e.x0 = 50 + Math.random()*(W-100) + (i ? (i%2 ? 44 : -44) : 0);
      e.x0 = Math.min(W-40, Math.max(40, e.x0));
      e.y0 = -14 - i*20;
      e.v = (16 + Math.random()*5) * spdMul;
      e.amp = 30 + Math.random()*16;
      e.w = 1.5;
    }
    const p = enemyPos(e);
    e.x = p.x; e.y = p.y;
    enemies.push(e);
  }
}

/* ============ Gestione stati ============ */
function setState(s){ state = s; stateT = 0; }

function startGame(){
  score = 0; lives = 3; level = 1; kills = 0; killsSincePow = 0;
  nextLifeAt = 2500; powerLevel = 0;
  hiscoreAtStart = hiscore;
  enemies = []; lasers = []; bullets = []; powerups = [];
  particles = []; popups = [];
  spawnT = 0.8; pulseT = 0;
  player.x = W/2; player.y = PLAYER_Y; player.invuln = 0; player.cool = 0;
  resetDrones();
  setState(ST.INTRO);
}

function addScore(n){
  score += n;
  if (score >= nextLifeAt){
    nextLifeAt += 2500;
    if (lives < 5){
      lives++;
      popups.push({ x: player.x, y: player.y-14, text: 'VITA EXTRA', life: 1.4, color: COLORS.amber });
      sfxExtraLife();
    }
  }
  if (score > hiscore){
    hiscore = score;
    storeSet('li_hiscore', String(hiscore));
  }
}
function addScorePopup(x, y, text_, color){
  popups.push({ x, y, text: text_, life: 1.1, color });
}

function boom(x, y, color, n){
  for (let i=0; i<n; i++){
    const a = Math.random()*6.28, v = 20+Math.random()*70;
    particles.push({ x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v, life: 0.3+Math.random()*0.25, color });
  }
}

/* ============ Update ============ */
function update(dt){
  stateT += dt;
  animT += dt;
  if (shake > 0) shake = Math.max(0, shake-dt*3);
  if (flash > 0) flash = Math.max(0, flash-dt*4);

  if (!reduceMotion)
    for (const s of stars){ s.y += s.v*dt; s.tw += dt*3; if (s.y > H){ s.y = -2; s.x = Math.random()*W; } }

  for (const p of particles){ p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  for (const p of popups){ p.y -= 12*dt; p.life -= dt; }
  popups = popups.filter(p => p.life > 0);

  switch (state){
    case ST.BOOT:
      if (stateT > 1.15) setState(ST.ATTRACT);
      break;

    case ST.ATTRACT:
      break; // si esce con startGame() dall'input

    case ST.INTRO:
      if (stateT > 1.6) setState(ST.PLAY);
      break;

    case ST.PLAY:
      updatePlay(dt);
      break;

    case ST.DYING:
      updateEnemies(dt, false);
      updatePowerups(dt, false);
      if (stateT > 1.1){
        if (lives <= 0){
          gameOver();
        } else {
          player.x = W/2; player.y = PLAYER_Y; player.invuln = 2.2;
          resetDrones();
          setState(ST.PLAY);
        }
      }
      break;

    case ST.GAMEOVER:
      updateEnemies(dt, false);
      if (stateT > 6) setState(ST.ATTRACT);
      break;
  }
}

function gameOver(){
  sfxGameOver();
  bullets = [];
  setState(ST.GAMEOVER);
}

function playerDie(){
  if (player.invuln > 0) return;
  lives--;
  powerLevel = Math.max(0, powerLevel-1);
  shake = 1; flash = 0.6;
  boom(player.x, player.y+4, COLORS.green, 26);
  boom(player.x, player.y+4, COLORS.white, 10);
  sfxPlayerBoom();
  bullets = [];
  setState(ST.DYING);
}

function updatePlay(dt){
  /* --- movimento player in ogni direzione (tastiera; il touch trascina) --- */
  const kx = (keys.right?1:0) - (keys.left?1:0);
  const ky = (keys.down?1:0) - (keys.up?1:0);
  if (kx !== 0) player.x += kx * 130 * dt;
  if (ky !== 0) player.y += ky * 130 * dt;
  player.x = Math.max(9, Math.min(W-9, player.x));
  player.y = Math.max(PLAYER_MIN_Y, Math.min(PLAYER_MAX_Y, player.y));

  /* droni gregari: inseguono la navicella ai lati, con un filo di elastico */
  for (let i=0; i<droneCount(); i++){
    const d = drones[i];
    const tx = player.x + (i === 0 ? 17 : -17);
    const ty = player.y + 3 + Math.sin(animT*4 + i*3)*2;
    const k = Math.min(1, 8*dt);
    d.x += (tx - d.x)*k;
    d.y += (ty - d.y)*k;
  }

  if (player.invuln > 0) player.invuln -= dt;
  if (player.cool > 0) player.cool -= dt;
  if ((keys.fire || pad.fire) && player.cool <= 0) fireLaser();

  /* --- battito di fondo --- */
  pulseT -= dt;
  if (pulseT <= 0){
    pulseT = Math.max(0.38, 0.62 - level*0.02);
    pulseAlt = !pulseAlt;
    sfxPulse(pulseAlt);
  }

  /* --- arrivo squadriglie --- */
  spawnT -= dt;
  if (spawnT <= 0){
    if (enemies.length < 7) spawnGroup();
    spawnT = Math.max(1.0, 2.3 - level*0.13) + Math.random()*0.6;
  }

  updateEnemies(dt, true);

  /* --- laser del giocatore --- */
  for (const l of lasers){
    l.y -= 320*dt;
    l.x += (l.vx||0)*dt;
    const len = l.len || 5;
    if (l.y < -(len+2) || l.x < -4 || l.x > W+4){ l.dead = true; continue; }
    for (const e of enemies){
      if (e.dead) continue;
      if (l.hits && l.hits.has(e)) continue;
      const s = enemySize(e.type);
      const ex = e.x - s.w/2, ey = e.y;
      /* test "spazzato" sull'intera lunghezza del raggio (niente tunneling
         ai framerate bassi); i raggi lunghi trapassano e restano attivi
         finche non esauriscono i bersagli */
      if (l.x >= ex && l.x <= ex+s.w &&
          l.y <= ey+s.h && l.y + len + 320*dt >= ey){
        if (!l.hits) l.hits = new Set();
        l.hits.add(e);
        e.hp--;
        if (e.hp <= 0){
          e.dead = true;
          killEnemy(e);
        } else {
          e.flash = 0.09;
          sfxHitTick();
        }
        if (l.hits.size >= 1 + (l.pierce||0)){ l.dead = true; break; }
      }
    }
  }
  lasers = lasers.filter(l => !l.dead);

  /* --- colpi nemici --- */
  for (const b of bullets){
    b.y += b.v*dt;
    if (b.y > GROUND_Y-2){ b.dead = true; boom(b.x, GROUND_Y-2, COLORS.dim, 3); continue; }
    if (player.invuln <= 0 &&
        b.y+4 >= player.y+1 && b.y <= player.y+8 &&
        Math.abs(b.x - player.x) < 6){
      b.dead = true;
      playerDie();
      break;
    }
  }
  bullets = bullets.filter(b => !b.dead);

  updatePowerups(dt, true);

  /* --- livello: sale con gli abbattimenti --- */
  const newLevel = 1 + Math.floor(kills/12);
  if (newLevel > level){
    level = newLevel;
    popups.push({ x: W/2, y: 150, text: 'LIVELLO '+level, life: 1.5, color: COLORS.cyan });
    sfxLevelUp();
  }
}

function killEnemy(e){
  const def = ENEMY_DEF[e.type];
  addScore(def.pts);
  addScorePopup(e.x, e.y, String(def.pts), def.color);
  boom(e.x, e.y+4, def.color, e.type === 'heavy' ? 20 : 12);
  sfxEnemyBoom(e.type === 'heavy');
  kills++;
  killsSincePow++;
  if (killsSincePow >= 7){
    killsSincePow = 0;
    powerups.push({ x: Math.min(W-14, Math.max(14, e.x)), y: Math.max(20, e.y), t: 0 });
  }
}

function updateEnemies(dt, canFire){
  for (const e of enemies){
    if (e.dead) continue;
    e.t += dt;
    if (e.flash > 0) e.flash -= dt;
    const p = enemyPos(e);
    e.x = p.x; e.y = p.y;

    /* una nave conta come "entrata in scena" solo quando raggiunge lo schermo:
       le gregarie partono fino a 64px fuori e non vanno eliminate prima */
    if (!e.seen && e.x > -14 && e.x < W+14 && e.y > -12 && e.y < H) e.seen = true;

    /* fuoco nemico: raro, solo dentro lo schermo e sopra il giocatore */
    if (canFire){
      e.fireT -= dt;
      if (e.fireT <= 0){
        e.fireT = Math.max(1.4, 3.4 - level*0.18) + Math.random()*2.2;
        const maxB = Math.min(8, 3 + level);
        if (bullets.length < maxB && e.y > 26 && e.y < 210 && e.x > 6 && e.x < W-6){
          bullets.push({ x: e.x, y: e.y + enemySize(e.type).h, v: Math.min(130, 68 + level*6) });
        }
      }
    }

    /* collisione col giocatore */
    if (state === ST.PLAY && player.invuln <= 0 && !e.dead){
      const s = enemySize(e.type);
      if (e.x + s.w/2 > player.x-6 && e.x - s.w/2 < player.x+6 &&
          e.y + s.h > player.y+1 && e.y < player.y+8){
        e.dead = true;
        killEnemy(e);
        playerDie();
      }
    }

    /* fuori dallo schermo: la nave se ne va, nessuna penalita */
    if ((e.seen && (e.y > H+14 || e.x < -20 || e.x > W+20)) || e.t > 45) e.dead = true;
  }
  enemies = enemies.filter(e => !e.dead);
}

function updatePowerups(dt, canCatch){
  for (const u of powerups){
    u.t += dt;
    u.y += 34*dt;
    u.x += Math.sin(u.t*2.4)*8*dt;
    if (u.y > GROUND_Y-4){ u.dead = true; continue; }
    if (canCatch && state === ST.PLAY &&
        u.y+10 > player.y && u.y < player.y+8 &&
        Math.abs(u.x - player.x) < 10){
      u.dead = true;
      if (powerLevel < POWER_MAX){
        powerLevel++;
        let msg;
        if (powerLevel === 1) msg = 'LASER DOPPIO!';
        else if (powerLevel === 2) msg = 'LASER TRIPLO!';
        else if (powerLevel === 3) msg = 'DRONE GREGARIO!';
        else if (powerLevel === 4) msg = 'SECONDO DRONE!';
        else msg = 'RAFFICA PIU VELOCE!';
        addScorePopup(player.x, player.y-14, msg, COLORS.green);
      } else {
        addScore(500);
        addScorePopup(player.x, player.y-14, 'BONUS 500', COLORS.amber);
      }
      sfxPowerup();
    }
  }
  powerups = powerups.filter(u => !u.dead);
}

function fireLaser(){
  if (state !== ST.PLAY) return;
  if (lasers.length >= 60) return;
  player.cool = fireCooldown();
  const y = player.y-2;
  const n = laserCount();
  if (n === 1){
    lasers.push({ x: player.x, y, vx: 0 });
  } else if (n === 2){
    lasers.push({ x: player.x-5, y, vx: 0 });
    lasers.push({ x: player.x+5, y, vx: 0 });
  } else {
    lasers.push({ x: player.x, y, vx: 0 });
    lasers.push({ x: player.x-5, y, vx: -46 });
    lasers.push({ x: player.x+5, y, vx: 46 });
  }
  /* anche i droni sparano */
  for (let i=0; i<droneCount(); i++){
    const d = drones[i];
    lasers.push({ x: d.x, y: d.y-4, vx: 0 });
  }
  sfxLaser(n, Math.min(4, Math.max(0, powerLevel-2)));
}

/* ============ Rendering ============ */
function text(str, x, y, color, size, align){
  cx.font = (size||8) + 'px "Press Start 2P"';
  cx.textAlign = align || 'left';
  cx.textBaseline = 'top';
  cx.fillStyle = color;
  cx.fillText(str, Math.round(x), Math.round(y));
}
function pad6(n){ return String(n).padStart(6,'0'); }

function draw(){
  cx.setTransform(1,0,0,1,0,0);
  cx.clearRect(0,0,W,H);
  cx.fillStyle = '#000';
  cx.fillRect(0,0,W,H);

  if (state === ST.BOOT){ drawBoot(); return; }

  if (shake > 0 && !reduceMotion){
    cx.translate(Math.round((Math.random()-0.5)*shake*5), Math.round((Math.random()-0.5)*shake*4));
  }

  /* stelle */
  for (const s of stars){
    cx.globalAlpha = 0.25 + 0.2*Math.sin(s.tw);
    cx.fillStyle = s.s === 2 ? COLORS.cyan : COLORS.white;
    cx.fillRect(Math.round(s.x), Math.round(s.y), 1, s.s === 2 ? 2 : 1);
  }
  cx.globalAlpha = 1;

  if (state === ST.ATTRACT){ drawAttract(); drawFlash(); return; }

  /* --- HUD --- */
  text('PUNTEGGIO', 8, 6, COLORS.dim, 8);
  text(pad6(score), 8, 17, COLORS.amber, 8);
  text('RECORD', W-8, 6, COLORS.dim, 8, 'right');
  text(pad6(hiscore), W-8, 17, COLORS.amber, 8, 'right');

  /* terreno */
  cx.fillStyle = COLORS.green;
  cx.fillRect(0, GROUND_Y, W, 1);

  /* vite, indicatore laser, livello */
  const shipIcon = sprite('ship1', 0, COLORS.green);
  for (let i=0; i<Math.max(0, lives-1); i++)
    cx.drawImage(shipIcon, 8 + i*17, GROUND_Y+5);
  text('LASER', W/2-40, GROUND_Y+6, COLORS.dim, 8);
  for (let i=0; i<3; i++){
    cx.fillStyle = i < laserCount() ? COLORS.green : '#1b2338';
    cx.fillRect(W/2+8+i*8, GROUND_Y+6, 5, 7);
  }
  for (let i=0; i<droneCount(); i++){
    cx.drawImage(sprite('drone', 0, COLORS.cyan), W/2+36+i*9, GROUND_Y+7);
  }
  if (speedTier() > 0)
    text('+'+speedTier(), W/2+58, GROUND_Y+6, COLORS.cyan, 8);
  text('LV '+level, W-8, GROUND_Y+6, COLORS.dim, 8, 'right');

  const frame = Math.floor(animT*6) % 2;

  /* nemici */
  for (const e of enemies){
    if (e.dead) continue;
    const s = enemySize(e.type);
    const col = e.flash > 0 ? COLORS.white : ENEMY_DEF[e.type].color;
    cx.drawImage(sprite(e.type, frame, col), Math.round(e.x - s.w/2), Math.round(e.y));
  }

  /* capsule [P] */
  for (const u of powerups){
    const pulse = 0.6 + 0.4*Math.sin(u.t*6);
    cx.globalAlpha = 0.35*pulse;
    cx.fillStyle = COLORS.green;
    cx.fillRect(Math.round(u.x)-7, Math.round(u.y)-1, 14, 13);
    cx.globalAlpha = 1;
    cx.fillStyle = '#03140a';
    cx.fillRect(Math.round(u.x)-5, Math.round(u.y), 11, 11);
    cx.strokeStyle = COLORS.green;
    cx.strokeRect(Math.round(u.x)-4.5, Math.round(u.y)+0.5, 10, 10);
    text('P', u.x, u.y+2, COLORS.green, 8, 'center');
  }

  /* player */
  const showShip = state !== ST.DYING && state !== ST.GAMEOVER &&
    !(player.invuln > 0 && Math.floor(player.invuln*10) % 2 === 0);
  if (showShip){
    cx.drawImage(sprite('ship'+laserCount(), 0, COLORS.green), Math.round(player.x-6), Math.round(player.y));
  }

  /* droni gregari */
  if (state === ST.PLAY || state === ST.INTRO){
    for (let i=0; i<droneCount(); i++){
      const d = drones[i];
      cx.drawImage(sprite('drone', frame, COLORS.cyan), Math.round(d.x-3), Math.round(d.y));
    }
  }

  /* laser (i raggi potenziati sono piu lunghi e trapassano le navi) */
  for (const l of lasers){
    const len = l.len || 5, lx = Math.round(l.x);
    cx.fillStyle = COLORS.white;
    cx.fillRect(lx, Math.round(l.y), 1, len);
    cx.fillStyle = COLORS.cyan;
    cx.fillRect(lx, Math.round(l.y)+len, 1, 3);
  }

  /* colpi nemici */
  for (const b of bullets){
    cx.fillStyle = COLORS.red;
    cx.fillRect(Math.round(b.x)-1, Math.round(b.y), 2, 4);
    cx.fillStyle = COLORS.white;
    cx.fillRect(Math.round(b.x)-1, Math.round(b.y)+1, 2, 1);
  }

  /* particelle */
  for (const p of particles){
    cx.globalAlpha = Math.min(1, p.life*3);
    cx.fillStyle = p.color;
    cx.fillRect(Math.round(p.x), Math.round(p.y), 2, 2);
  }
  cx.globalAlpha = 1;

  /* popup punti */
  for (const p of popups){
    cx.globalAlpha = Math.min(1, p.life*2);
    text(p.text, p.x, p.y, p.color, 8, 'center');
  }
  cx.globalAlpha = 1;

  /* overlay di stato */
  if (state === ST.INTRO){
    text('LIVELLO 1', W/2, 140, COLORS.cyan, 8, 'center');
    text('DIFENDI LA GALASSIA', W/2, 158, COLORS.dim, 8, 'center');
  }
  if (state === ST.GAMEOVER) drawGameOver();
  if (paused){
    cx.fillStyle = 'rgba(0,0,0,0.6)';
    cx.fillRect(0,0,W,H);
    if (Math.floor(performance.now()/400) % 2 === 0)
      text('PAUSA', W/2, 150, COLORS.amber, 8, 'center');
  }

  drawFlash();
}

function drawFlash(){
  if (flash > 0){
    cx.globalAlpha = flash*0.5;
    cx.fillStyle = '#fff';
    cx.fillRect(0,0,W,H);
    cx.globalAlpha = 1;
  }
}

/* Accensione CRT: linea orizzontale che sboccia a pieno schermo */
function drawBoot(){
  const t = stateT;
  cx.fillStyle = '#000'; cx.fillRect(0,0,W,H);
  if (t < 0.4){
    const w = (t/0.4) * W;
    cx.fillStyle = COLORS.white;
    cx.globalAlpha = 0.9;
    cx.fillRect((W-w)/2, H/2-1, w, 2);
    cx.globalAlpha = 1;
  } else if (t < 0.9){
    const k = (t-0.4)/0.5;
    const h = 2 + k*k*H;
    cx.fillStyle = COLORS.white;
    cx.globalAlpha = 0.85 - k*0.55;
    cx.fillRect(0, (H-h)/2, W, h);
    cx.globalAlpha = 1;
  } else {
    cx.fillStyle = '#fff';
    cx.globalAlpha = Math.max(0, 1-(t-0.9)/0.25) * 0.3;
    cx.fillRect(0,0,W,H);
    cx.globalAlpha = 1;
  }
}

function drawAttract(){
  const t = stateT;

  /* titolo con "aberrazione cromatica" */
  text('LASER', W/2+2, 56+2, COLORS.magenta, 16, 'center');
  text('LASER', W/2, 56, COLORS.cyan, 16, 'center');
  text('INVADERS', W/2+2, 80+2, COLORS.magenta, 16, 'center');
  text('INVADERS', W/2, 80, COLORS.cyan, 16, 'center');
  text('GALASSIA 1982', W/2, 106, COLORS.dim, 8, 'center');

  /* tabella punti con sprite animati */
  const fr = Math.floor(t*2) % 2;
  const rows = [
    ['dart',  COLORS.cyan,    '50 PUNTI',  140],
    ['wing',  COLORS.magenta, '100 PUNTI', 162],
    ['heavy', COLORS.amber,   '150 PUNTI', 184]
  ];
  for (const [name, col, label, y] of rows){
    const sp = sprite(name, fr, col);
    cx.drawImage(sp, Math.round(W/2 - 52 - sp.width/2), y-1);
    text('= '+label, W/2-36, y, col, 8);
  }
  /* riga capsula [P] */
  const py = 208;
  cx.fillStyle = '#03140a';
  cx.fillRect(W/2-52-5, py-1, 11, 11);
  cx.strokeStyle = COLORS.green;
  cx.strokeRect(W/2-52-4.5, py-0.5, 10, 10);
  text('P', W/2-52, py+1, COLORS.green, 8, 'center');
  text('= LASER SEMPRE', W/2-36, py, COLORS.green, 8);
  text('PIU POTENTE!', W/2-36, py+12, COLORS.green, 8);

  /* invito lampeggiante */
  if (Math.floor(t*2) % 2 === 0){
    text(isTouch ? 'TOCCA PER GIOCARE' : 'PREMI START', W/2, 250, COLORS.white, 8, 'center');
  }
  text('RECORD '+pad6(hiscore), W/2, 274, COLORS.amber, 8, 'center');
  text('(C) 1982 BACCHIN CORP.', W/2, 298, COLORS.dim, 8, 'center');
}

function drawGameOver(){
  cx.fillStyle = 'rgba(0,0,0,0.55)';
  cx.fillRect(0, 118, W, 84);
  /* scritta che si "digita" lettera per lettera */
  const msg = 'FINE PARTITA';
  const n = Math.min(msg.length, Math.floor(stateT/0.12));
  text(msg.slice(0,n), W/2, 132, COLORS.red, 12, 'center');
  if (stateT > msg.length*0.12 + 0.3){
    text('PUNTEGGIO '+pad6(score), W/2, 158, COLORS.white, 8, 'center');
    if (score > hiscoreAtStart && score > 0 && Math.floor(stateT*3)%2===0)
      text('NUOVO RECORD!', W/2, 176, COLORS.amber, 8, 'center');
  }
}

/* ============ Input ============ */
const keys = { left:false, right:false, up:false, down:false, fire:false };
const pad  = { fire:false };
const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;

function anyStart(){
  audioResume();
  if (paused){ togglePause(false); return; }
  if (state === ST.ATTRACT) startGame();
  else if (state === ST.GAMEOVER && stateT > 1.5) setState(ST.ATTRACT);
}

addEventListener('keydown', e => {
  if (e.repeat) return;
  audioResume();
  switch (e.code){
    case 'ArrowLeft': case 'KeyA': keys.left = true; e.preventDefault(); break;
    case 'ArrowRight': case 'KeyD': keys.right = true; e.preventDefault(); break;
    case 'ArrowUp': case 'KeyW': keys.up = true; e.preventDefault(); break;
    case 'ArrowDown': case 'KeyS': keys.down = true; e.preventDefault(); break;
    case 'Space':
      e.preventDefault();
      if (state === ST.ATTRACT || state === ST.GAMEOVER) anyStart();
      else { keys.fire = true; fireOnPress(); }
      break;
    case 'Enter': anyStart(); break;
    case 'KeyP': togglePause(); break;
    case 'KeyM': setMuted(!muted); break;
    case 'KeyL': cycleLaserSfx(); break;
  }
});
addEventListener('keyup', e => {
  switch (e.code){
    case 'ArrowLeft': case 'KeyA': keys.left = false; break;
    case 'ArrowRight': case 'KeyD': keys.right = false; break;
    case 'ArrowUp': case 'KeyW': keys.up = false; break;
    case 'ArrowDown': case 'KeyS': keys.down = false; break;
    case 'Space': keys.fire = false; break;
  }
});
function fireOnPress(){
  if (state === ST.PLAY && !paused && player.cool <= 0) fireLaser();
}

/* Touch stile "Morte Nera": trascina il dito ovunque sullo schermo per
   muovere la navicella (movimento relativo, il dito non copre la nave);
   l'unico pulsante e FUOCO. */
const screenEl = document.getElementById('screen');
let dragId = null, dragLastX = 0, dragLastY = 0;
screenEl.addEventListener('pointerdown', e => {
  audioResume();
  if (state === ST.ATTRACT || state === ST.GAMEOVER){ anyStart(); return; }
  if (paused){ togglePause(false); return; }
  if (e.pointerType !== 'mouse' && dragId === null){
    dragId = e.pointerId;
    dragLastX = e.clientX;
    dragLastY = e.clientY;
    try{ screenEl.setPointerCapture(e.pointerId); }catch(err){}
  }
});
screenEl.addEventListener('pointermove', e => {
  if (e.pointerId !== dragId) return;
  const r = cv.getBoundingClientRect();
  const dx = (e.clientX - dragLastX) / r.width * W;
  const dy = (e.clientY - dragLastY) / r.height * H;
  dragLastX = e.clientX;
  dragLastY = e.clientY;
  if (state === ST.PLAY && !paused){
    player.x = Math.max(9, Math.min(W-9, player.x + dx*1.5));
    player.y = Math.max(PLAYER_MIN_Y, Math.min(PLAYER_MAX_Y, player.y + dy*1.5));
  }
});
function dragEnd(e){ if (e.pointerId === dragId) dragId = null; }
screenEl.addEventListener('pointerup', dragEnd);
screenEl.addEventListener('pointercancel', dragEnd);
screenEl.addEventListener('lostpointercapture', dragEnd);

function holdButton(el, prop){
  const ids = new Set();
  const on = e => {
    e.preventDefault();
    audioResume();
    ids.add(e.pointerId);
    pad[prop] = true;
    el.classList.add('held');
    if (prop === 'fire'){
      if (state === ST.ATTRACT || state === ST.GAMEOVER) anyStart();
      else fireOnPress();
    }
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
  };
  const off = e => {
    ids.delete(e.pointerId);
    if (ids.size === 0){ pad[prop] = false; el.classList.remove('held'); }
  };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('lostpointercapture', off);
}
holdButton(document.getElementById('btnFire'), 'fire');

const btnSound = document.getElementById('btnSound');
const btnPause = document.getElementById('btnPause');
const btnLaserSfx = document.getElementById('btnLaserSfx');
btnSound.textContent = muted ? 'AUDIO OFF' : 'AUDIO ON';
btnLaserSfx.textContent = LASER_SFX[laserSfx];
btnSound.addEventListener('click', () => { audioResume(); setMuted(!muted); });
btnPause.addEventListener('click', () => togglePause());

function cycleLaserSfx(){
  laserSfx = (laserSfx + 1) % LASER_SFX.length;
  storeSet('li_lasersfx', String(laserSfx));
  btnLaserSfx.textContent = LASER_SFX[laserSfx];
  audioResume();
  sfxLaser(laserCount(), 0);      // anteprima immediata del timbro
}
btnLaserSfx.addEventListener('click', cycleLaserSfx);

function togglePause(force){
  if (state !== ST.PLAY && state !== ST.INTRO && state !== ST.DYING) return;
  paused = force != null ? force : !paused;
  btnPause.textContent = paused ? 'RIPRENDI' : 'PAUSA';
  if (ac){
    if (paused) ac.suspend();
    else ac.resume();
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden && (state === ST.PLAY || state === ST.INTRO || state === ST.DYING))
    togglePause(true);
});

/* blocca lo scroll-rimbalzo su iOS */
document.addEventListener('touchmove', e => e.preventDefault(), { passive:false });

/* ============ Ridimensionamento ============ */
const stage = document.getElementById('stage');
function resize(){
  const sw = stage.clientWidth, sh = stage.clientHeight;
  const scale = Math.min(sw/(W+20), sh/(H+20));
  screenEl.style.width = Math.floor(W*scale)+'px';
  screenEl.style.height = Math.floor(H*scale)+'px';
}
new ResizeObserver(resize).observe(stage);
addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();

/* ============ Loop principale ============ */
let lastT = performance.now();
try{
  if (document.fonts) document.fonts.load('8px "Press Start 2P"');
}catch(e){}

function frame(now){
  const dt = Math.min(0.05, (now-lastT)/1000);
  lastT = now;
  if (!paused) update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* Interfaccia di debug per i collaudi automatici (non usata dal gioco) */
window.__dbg = {
  get state(){ return state; },
  get score(){ return score; },
  get lives(){ return lives; },
  get level(){ return level; },
  get enemies(){ return enemies.length; },
  get kills(){ return kills; },
  get playerX(){ return player.x; },
  get playerY(){ return player.y; },
  get laserLevel(){ return laserCount(); },
  get powerLevel(){ return powerLevel; },
  get drones(){ return droneCount(); },
  get speed(){ return speedTier(); },
  setLaser(n){ powerLevel = Math.max(0, n); },
  spawnPowerup(){ powerups.push({ x: player.x, y: player.y-40, t: 0 }); }
};

/* ============ Service worker (offline / PWA) ============ */
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
